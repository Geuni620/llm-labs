<script>
(() => {
  const root = document.getElementById('wiki-raw-preview');
  const data = JSON.parse(document.getElementById('wiki-raw-payload').textContent);
  const select = root.querySelector('#wiki-raw-select');
  const formatNumber = value => new Intl.NumberFormat('ko-KR').format(value);
  root.querySelector('#wiki-raw-summary').textContent =
    '2025년 8월 스냅샷 · 한국어 · ' + formatNumber(data.manifest.total_rows) +
    '개 문서 · ' + data.manifest.columns.length + '개 열';
  for (const file of data.manifest.files) {
    const row = document.createElement('tr');
    const name = document.createElement('th');
    name.scope = 'row';
    const code = document.createElement('code');
    code.textContent = file.file.split('/').pop();
    name.append(code);
    const count = document.createElement('td');
    count.className = 'text-end';
    count.textContent = formatNumber(file.rows);
    const size = document.createElement('td');
    size.className = 'text-end';
    size.textContent = (file.bytes / 1e9).toFixed(2) + ' GB';
    row.append(name, count, size);
    root.querySelector('#wiki-raw-files').append(row);
  }
  data.preview.forEach((article, index) => {
    const option = document.createElement('option');
    option.value = String(index);
    option.textContent = (index + 1) + '. ' + article.title;
    select.append(option);
  });
  function display() {
    const article = data.preview[Number(select.value)];
    root.querySelector('#wiki-raw-id').textContent = article.id;
    root.querySelector('#wiki-raw-url').href = article.url;
    root.querySelector('#wiki-raw-modified').textContent = '문서 마지막 수정일: ' + article.date_modified;
    root.querySelector('#wiki-raw-text').textContent = article.text_excerpt;
    const body = root.querySelector('#wiki-raw-fields');
    body.replaceChildren();
    for (const field of data.manifest.columns) {
      const row = document.createElement('tr');
      const name = document.createElement('th');
      name.scope = 'row';
      const code = document.createElement('code');
      code.textContent = field.name;
      name.append(code);
      const type = document.createElement('td');
      type.textContent = field.type;
      const value = document.createElement('td');
      const original = article.values[field.name];
      value.textContent = original === null ? 'null' : String(original);
      row.append(name, type, value);
      body.append(row);
    }
  }
  function applyState(value) {
    const index = Number(value);
    if (Number.isInteger(index) && index >= 0 && index < data.preview.length) {
      select.value = String(index);
      display();
    }
  }
  select.addEventListener('change', () => {
    display();
    if (window.openai && typeof window.openai.setWidgetState === 'function') {
      window.openai.setWidgetState({modelContent:{articleIndex:Number(select.value)},privateContent:null}).catch(() => {});
    }
  });
  if (window.openai && window.openai.widgetState) {
    const state = window.openai.widgetState.modelContent || window.openai.widgetState;
    applyState(state.articleIndex);
  }
  window.addEventListener('openai:set_globals', event => {
    const state = event.detail && event.detail.globals && event.detail.globals.widgetState;
    if (state) applyState((state.modelContent || state).articleIndex);
  });
  display();
  console.log('Raw Parquet preview ready:',data.preview.length,'articles,',data.manifest.columns.length,'fields.');
})();
</script>
