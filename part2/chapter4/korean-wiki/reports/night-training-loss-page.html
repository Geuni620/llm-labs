    svg.append('desc').text('가로축은 학습기의 실제 경과 시간, 세로축은 타깃당 평균 음의 로그 확률입니다. 낮을수록 검증 정답에 높은 확률을 부여합니다.');
    const grid=svg.append('g').attr('aria-hidden','true');
    const yTicks=d3.ticks(...y.domain(),5);
    grid.selectAll('line').data(yTicks).join('line').attr('x1',left).attr('x2',right).attr('y1',d=>y(d)).attr('y2',d=>y(d)).attr('stroke','var(--border)').attr('stroke-width',1);
    svg.append('rect').attr('data-chart-frame','').attr('x',left).attr('y',top).attr('width',right-left).attr('height',bottom-top).attr('fill','none').attr('stroke','var(--border)').attr('stroke-width',1);
    svg.append('g').attr('class','night-x-axis').attr('transform',`translate(0,${bottom})`).call(d3.axisBottom(x).tickValues(d3.ticks(...x.domain(),width<420?3:6)).tickFormat(d3.format('~g')).tickSize(4).tickPadding(8));
    svg.append('g').attr('class','night-y-axis').attr('transform',`translate(${left},0)`).call(d3.axisLeft(y).tickValues(yTicks).tickFormat(svgNode.dataset.panel==='trained'?d3.format('.1f'):d3.format('~g')).tickSize(0).tickPadding(10));
    svg.append('text').attr('class','axis-title').attr('data-axis','x').attr('x',(left+right)/2).attr('y',height-8).attr('text-anchor','middle').text('실제 경과 시간 (시간)');
    svg.append('text').attr('class','axis-title').attr('data-axis','y').attr('transform','rotate(-90)').attr('x',-(top+bottom)/2).attr('y',16).attr('text-anchor','middle').text('검증 Loss (nats/타깃)');
    const epoch=data.find(d=>d.label==='epoch_1');
    if(epoch&&epoch.x>=xs[0]&&epoch.x<=xs[1]){
      svg.append('line').attr('x1',x(epoch.x)).attr('x2',x(epoch.x)).attr('y1',top).attr('y2',bottom).attr('stroke','var(--border)').attr('stroke-width',1);
      svg.append('text').attr('data-optional-label','').attr('x',x(epoch.x)+5).attr('y',top+15).text('1에폭');
    }
    const line=d3.line().x(d=>x(d.x));
    series.filter(s=>visible.has(s.id)).forEach(s=>{
      const group=svg.append('g').attr('data-line-series',s.id);
      group.append('path').datum(values).attr('d',line.y(d=>y(d[s.key]))).attr('fill','none').attr('stroke',s.color).attr('stroke-width',2);
      group.selectAll('path.night-point').data(values).join('path').attr('class','night-point').attr('d',d3.symbol(s.symbol,22)).attr('transform',d=>`translate(${x(d.x)},${y(d[s.key])})`).attr('fill',s.color);
      const last=values.at(-1);
      group.append('text').attr('data-optional-label','').attr('data-end-label',s.id).attr('x',x(last.x)-7).attr('y',y(last[s.key])-9).attr('text-anchor','end').text(format(last[s.key]));
    });
    const hover=svg.append('g').attr('data-hover-layer','').style('display','none').attr('pointer-events','none');
    const guide=hover.append('line').attr('data-chart-hover-guide','').attr('y1',top).attr('y2',bottom).attr('stroke','var(--muted-foreground)').attr('stroke-width',1);
    const hoverMarks=new Map(series.filter(s=>visible.has(s.id)).map(s=>[s.id,hover.append('path').attr('data-chart-hover-marker',s.id).attr('d',d3.symbol(s.symbol,46)).attr('fill',s.color)]));
    function show(event){
      if(!visible.size)return;
      const px=Math.max(x(xs[0]),Math.min(x(xs[1]),d3.pointer(event,svgNode)[0]));const hour=x.invert(px);
      const nearest=bisector(values,hour),i=d3.bisector(d=>d.x).left(values,hour);const a=values[Math.max(0,i-1)],b=values[Math.min(values.length-1,i)];
      const fraction=a.x===b.x?0:(hour-a.x)/(b.x-a.x);hover.style('display',null);guide.attr('x1',px).attr('x2',px);
      root.querySelectorAll('[data-hover-layer]').forEach(e=>{if(e!==hover.node())e.style.display='none'});
      tooltip.replaceChildren();const exact=Math.abs(x(values[nearest].x)-px)<.5;
      const head=document.createElement('div');head.textContent=`경과 ${d3.format('.2f')(hour)}시간 · ${exact?'실측점':'점 사이 선형 보간'}`;tooltip.append(head);
      series.filter(s=>visible.has(s.id)).forEach(s=>{
        const value=a[s.key]+fraction*(b[s.key]-a[s.key]);hoverMarks.get(s.id).attr('transform',`translate(${px},${y(value)})`);
        const row=document.createElement('div');row.className='night-tooltip-row';row.dataset.tooltipSeries=s.id;
        const label=document.createElement('span');label.textContent=s.label;const number=document.createElement('span');number.textContent=format(value);row.append(label,number);tooltip.append(row);
      });
      const note=document.createElement('div');note.className='night-tooltip-note text-small';note.textContent=`가까운 실제 평가 ${values[nearest].time} · ${d3.format('.3f')(values[nearest].epoch)}에폭`;tooltip.append(note);
      tooltip.hidden=false;const rb=root.getBoundingClientRect(),sb=svgNode.getBoundingClientRect(),box=tooltip.getBoundingClientRect();
      const tooltipLeft=Math.max(8,Math.min(sb.left-rb.left+px+12,rb.width-box.width-8));
      const tooltipTop=Math.max(0,Math.min(sb.top-rb.top+top+8,root.offsetHeight-box.height));
      tooltip.style.left=`${tooltipLeft}px`;tooltip.style.top=`${tooltipTop}px`;active={svgNode,px,hour};
    }
    svg.append('rect').attr('data-chart-hit','').attr('data-chart-hover-overlay','cross-series').attr('x',left).attr('y',top).attr('width',right-left).attr('height',bottom-top).attr('fill','transparent').style('touch-action','pan-y')
      .on('pointermove',event=>{if(!pinned)show(event)})
      .on('pointerleave',()=>{if(!pinned)clearHover()})
      .on('pointerdown',event=>{pinned=!pinned;pinned?show(event):clearHover()});
    requestAnimationFrame(()=>{
      const bounds=svgNode.getBoundingClientRect();const labels=[...svgNode.querySelectorAll('text')];
      labels.filter(e=>e.hasAttribute('data-optional-label')).forEach(e=>{const b=e.getBoundingClientRect();if(b.left<bounds.left+4||b.right>bounds.right-4)e.remove()});
      const check={panel:svgNode.dataset.panel,width,labelsInside:[...svgNode.querySelectorAll('text')].every(e=>{const b=e.getBoundingClientRect();return b.left>=bounds.left-1&&b.right<=bounds.right+1&&b.top>=bounds.top-1&&b.bottom<=bounds.bottom+1}),xTicks:svgNode.querySelectorAll('.night-x-axis .tick').length};
      layoutChecks=layoutChecks.filter(c=>c.panel!==check.panel);layoutChecks.push(check);root.dataset.layoutPassed=String(layoutChecks.every(c=>c.labelsInside&&(c.width>=420||c.xTicks<=4)));
    });
  }
  function drawAll(){panels.forEach(draw)}
  setButtons();new ResizeObserver(()=>{clearHover();pinned=false;drawAll()}).observe(root);drawAll();
  window.__nightLossQA=()=>{
    const before=root.querySelectorAll('[data-line-series="content"]').length;
    const key=root.querySelector('[data-series="content"]');key.click();const hidden=root.querySelectorAll('[data-line-series="content"]').length===0;key.click();
    const overlay=panels[0].querySelector('[data-chart-hit]'),box=overlay.getBoundingClientRect();
    overlay.dispatchEvent(new PointerEvent('pointermove',{bubbles:true,clientX:box.left+box.width*.53,clientY:box.top+box.height*.5,pointerType:'mouse'}));
    const hovered=!tooltip.hidden&&root.querySelectorAll('[data-tooltip-series]').length===visible.size;
    const guides=[...root.querySelectorAll('[data-chart-hover-guide]')].filter(g=>g.closest('[data-hover-layer]').style.display!=='none');
    const exactGuide=guides.length===1&&Math.abs(Number(guides[0].getAttribute('x1'))-active.px)<.01;
    const result={sourcePoints:data.length,before,legendTogglePassed:hidden,hoverPassed:hovered,exactCursorGuidePassed:exactGuide,layout:layoutChecks,overflow:root.scrollWidth>root.clientWidth};clearHover();return result;
  };
})();
