<div id="wiki-fixedwork-cpu-comparison">
  <h3>같은 학습량의 CPU 계산 시간</h3>
  <div class="text-small" data-run-status>실측값 준비 중</div>
  <div class="text-small text-muted" data-run-scope></div>
  <div class="text-small text-muted" data-model-scope></div>
  <div class="fixedwork-legend text-small">
    <span><span class="control-swatch" aria-hidden="true"></span>각 후보의 로컬 기준 A₁·A₂</span>
    <span><span class="candidate-swatch" aria-hidden="true"></span>후보 B₁·B₂</span>
  </div>
  <div class="fixedwork-facets" data-candidate-facets></div>
  <div class="text-small text-muted">절감률: 주변 기준 평균 대비 · 후보 2회 범위(신뢰구간 아님)</div>
  <div class="text-small text-muted">CPU 시간은 모든 스레드의 합 · 학습 시간 환산은 경과시간 기준</div>
  <div class="text-small text-muted" data-extrapolation-scope></div>
  <div class="tooltip" role="tooltip" hidden></div>
  <script type="application/json" data-fixedwork-payload>__DATA__</script>
</div>
<style>
  #wiki-fixedwork-cpu-comparison { position: relative; display: grid; gap: 8px; min-width: 0; }
  #wiki-fixedwork-cpu-comparison .fixedwork-legend { display: flex; gap: 8px 16px; flex-wrap: wrap; }
  #wiki-fixedwork-cpu-comparison .fixedwork-legend > span { display: inline-flex; align-items: center; gap: 6px; }
  #wiki-fixedwork-cpu-comparison .control-swatch,
  #wiki-fixedwork-cpu-comparison .candidate-swatch { display: inline-block; width: 8px; height: 8px; flex: none; }
  #wiki-fixedwork-cpu-comparison .control-swatch { background: var(--viz-series-2); border-radius: 50%; }
  #wiki-fixedwork-cpu-comparison .candidate-swatch { background: var(--viz-series-1); transform: rotate(45deg); }
  #wiki-fixedwork-cpu-comparison .fixedwork-facets { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 20px; min-width: 0; }
  #wiki-fixedwork-cpu-comparison .fixedwork-facet { display: grid; gap: 6px; min-width: 0; align-content: start; }
  #wiki-fixedwork-cpu-comparison .facet-title { font-weight: 500; }
  #wiki-fixedwork-cpu-comparison .fixedwork-chart { display: block; width: 100%; height: 254px; overflow: visible; }
  #wiki-fixedwork-cpu-comparison .fixedwork-chart text { fill: var(--foreground); font-size: 12px; font-weight: 400; }
  #wiki-fixedwork-cpu-comparison .fixedwork-chart .axis-title { font-weight: 500; }
  #wiki-fixedwork-cpu-comparison .axis path,
  #wiki-fixedwork-cpu-comparison .axis line,
  #wiki-fixedwork-cpu-comparison .grid line,
  #wiki-fixedwork-cpu-comparison [data-chart-frame] { fill: none; stroke: var(--border); stroke-width: 1; }
  #wiki-fixedwork-cpu-comparison .grid path { display: none; }
  #wiki-fixedwork-cpu-comparison .trial-hit { fill: transparent; }
  #wiki-fixedwork-cpu-comparison .trial-detail { display: grid; gap: 4px; margin-top: 12px; overflow-wrap: anywhere; }
  #wiki-fixedwork-cpu-comparison .tooltip { position: absolute; pointer-events: none; box-sizing: border-box; padding: 16px; border-radius: var(--radius); background: var(--popover); color: var(--popover-foreground); max-width: calc(100% - 8px); white-space: normal; overflow-wrap: anywhere; }
</style>
<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
<script>
(() => {
  const root = document.getElementById("wiki-fixedwork-cpu-comparison");
  const run = JSON.parse(root.querySelector("[data-fixedwork-payload]").textContent);
  const status = root.querySelector("[data-run-status]");
  if (run.status !== "complete") {
    status.textContent = `실측 미완료 · ${run.status ?? "준비 중"}`;
    return;
  }
  const number = new Intl.NumberFormat("ko-KR");
  const decimal = new Intl.NumberFormat("ko-KR", {minimumFractionDigits: 2, maximumFractionDigits: 2});
  const signed = new Intl.NumberFormat("ko-KR", {minimumFractionDigits: 2, maximumFractionDigits: 2, signDisplay: "always"});
  const fine = new Intl.NumberFormat("ko-KR", {minimumFractionDigits: 3, maximumFractionDigits: 3});
  const seconds = value => `${(value < 1 ? fine : decimal).format(value)}초`;
  const hours = value => `${decimal.format(value)}시간`;
  const percent = value => `${signed.format(value)}%`;
  const labels = {fixed_norm: "고정 블록 노름", softmax_inv_batch: "Softmax 역수 곱셈", minimal_zero: "필요한 gradient만 초기화", combined: "세 가지 모두 적용"};
  const ids = ["fixed_norm", "softmax_inv_batch", "minimal_zero", "combined"];
  const phaseLabels = ["A₁ 기준", "B₁ 후보", "B₂ 후보", "A₂ 기준"];
  const tooltip = root.querySelector(".tooltip");
  root.addEventListener("pointerdown", event => {
    if (!event.target.closest("[data-chart-hit]")) {
      tooltip.hidden = true;
      tooltip.dataset.pinned = "false";
    }
  });
  const trials = new Map(run.trials.map(trial => [trial.trial_id, trial]));
  const measuredTimes = run.trials.map(trial => trial.measurement.elapsed_seconds);
  const [minimum, maximum] = d3.extent([0, ...measuredTimes]);
  const sharedDomain = [minimum, maximum + Math.max(maximum * 0.12, (maximum - minimum) * 0.12)];
  const cfg = run.config;
  status.textContent = `동일량 본 측정 ${number.format(run.trials.length)}회 완료 · 후보별 A–B–B–A`;
  root.querySelector("[data-run-scope]").textContent = `각 ${number.format(run.main_steps)}스텝 · ${number.format(run.events_per_trial)}회 예측 · 기준 O3 native + CPU vForce + OpenMP ${cfg.threads}스레드`;
  root.querySelector("[data-model-scope]").textContent = `V=${number.format(cfg.V)} · C=${cfg.C} · D=${cfg.D} · H=${cfg.H} · B=${cfg.B} · seed=${cfg.seed}`;
  root.querySelector("[data-extrapolation-scope]").textContent = `5에폭: ${number.format(621162675)}회 예측 기준 단기 환산 · 실제 학습 완료 시간 아님`;

  function showTooltip(event, trial, svgNode, pin = false) {
    const value = trial.measurement;
    const projection = 621162675 / value.targets_per_second / 3600;
    tooltip.replaceChildren();
    for (const text of [
      `${phaseLabels[trial.position - 1]} · ${trial.trial_id}`,
      `계산 경과시간 ${seconds(value.elapsed_seconds)}`,
      `CPU 누적 사용시간 ${seconds(value.process_cpu_seconds)}`,
      `초당 ${number.format(Math.round(value.targets_per_second))}회 예측`,
      `5 epoch 단기 환산 ${hours(projection)}`
    ]) {
      const line = document.createElement("div");
      line.textContent = text;
      tooltip.append(line);
    }
    tooltip.hidden = false;
    tooltip.dataset.pinned = pin ? "true" : "false";
    const [pointerX, pointerY] = d3.pointer(event, svgNode);
    const rootBox = root.getBoundingClientRect();
    const svgBox = svgNode.getBoundingClientRect();
    const left = Math.min(Math.max(4, svgBox.left - rootBox.left + pointerX + 10), rootBox.width - tooltip.offsetWidth - 4);
    const top = Math.max(4, svgBox.top - rootBox.top + pointerY - tooltip.offsetHeight - 10);
    tooltip.style.left = `${Math.max(4, left)}px`;
    tooltip.style.top = `${top}px`;
  }
  function overlap(a, b) {
    return a.left < b.right + 4 && a.right + 4 > b.left && a.top < b.bottom + 4 && a.bottom + 4 > b.top;
  }
  function declutter(svg) {
    const titles = svg.selectAll(".axis-title").nodes().map(node => node.getBoundingClientRect());
    const kept = [];
    for (const node of svg.selectAll(".x-axis .tick text").nodes()) {
      const box = node.getBoundingClientRect();
      if (titles.some(title => overlap(box, title)) || kept.some(other => overlap(box, other))) d3.select(node.parentNode).remove();
      else kept.push(box);
    }
  }

  for (const id of ids) {
    const comparison = run.comparisons.find(item => item.candidate === id);
    if (!comparison) continue;
    const block = [...comparison.control_trial_ids, ...comparison.candidate_trial_ids].map(identifier => trials.get(identifier)).filter(Boolean).sort((a, b) => a.position - b.position);
    const panel = document.createElement("section");
    panel.className = "fixedwork-facet";
    const title = document.createElement("div");
    title.className = "facet-title";
    title.textContent = labels[id] ?? id;
    const plot = document.createElement("div");
    const verdict = document.createElement("div");
    verdict.className = "text-small";
    const highDrift = comparison.high_control_drift === true;
    const minSaved = comparison.wall_saved_percent_min;
    const maxSaved = comparison.wall_saved_percent_max;
    verdict.textContent = highDrift ? "로컬 기준 변동 >20% · 판단 유보" : minSaved > 0 ? "후보 2회 모두 로컬 기준보다 짧음" : maxSaved < 0 ? "후보 2회 모두 로컬 기준보다 오래 걸림" : "개선·악화 방향이 섞임 · 판단 유보";
    const local = document.createElement("div");
    local.className = "text-small tabular-nums";
    local.textContent = `로컬 기준 평균 ${seconds(comparison.control_elapsed_seconds)} · 후보 ${seconds(d3.min(comparison.candidate_elapsed_seconds))}–${seconds(d3.max(comparison.candidate_elapsed_seconds))}`;
    const savings = document.createElement("div");
    savings.className = "text-small tabular-nums";
    savings.textContent = `계산 시간 절감률 ${percent(minSaved)}–${percent(maxSaved)}`;
    const drift = document.createElement("div");
    drift.className = "text-small text-muted tabular-nums";
    drift.textContent = `기준 양끝 변동 ${decimal.format(comparison.checked_local_control_drift_percent ?? comparison.control_drift_percent)}%`;
    const projection = document.createElement("div");
    projection.className = "text-small tabular-nums";
    const extra = comparison.extrapolation_only;
    projection.textContent = `5 epoch 단기 환산: 기준 ${hours(extra.control_epoch5_hours)} · 후보 ${hours(d3.min(extra.candidate_epoch5_hours_per_trial))}–${hours(d3.max(extra.candidate_epoch5_hours_per_trial))}`;
    const details = document.createElement("details");
    details.className = "text-small";
    const summary = document.createElement("summary");
    summary.textContent = "4회 측정의 예측 속도·CPU 누적 시간";
    details.append(summary);
    for (const trial of block) {
      const item = document.createElement("div");
      item.className = "trial-detail tabular-nums";
      const heading = document.createElement("div");
      heading.textContent = `${phaseLabels[trial.position - 1]} · ${trial.trial_id}`;
      const timing = document.createElement("div");
      timing.textContent = `계산 ${seconds(trial.measurement.elapsed_seconds)} · CPU 누적 ${seconds(trial.measurement.process_cpu_seconds)}`;
      const rate = document.createElement("div");
      rate.textContent = `초당 ${number.format(Math.round(trial.measurement.targets_per_second))}회 예측 · 5 epoch 단기 환산 ${hours(621162675 / trial.measurement.targets_per_second / 3600)}`;
      item.append(heading, timing, rate);
      details.append(item);
    }
    panel.append(title, plot, verdict, local, savings, drift, projection, details);
    root.querySelector("[data-candidate-facets]").append(panel);
    const svg = d3.select(plot).append("svg").attr("class", "fixedwork-chart").attr("role", "img");
    svg.append("title").text(`${title.textContent}: 각 후보의 기준 2회와 후보 2회 계산 시간`);
    svg.append("desc").text(`공유 X축은 실제 계산 경과시간(초)입니다. A1, B1, B2, A2 순서의 네 측정값이 모두 표시됩니다. ${verdict.textContent}. ${savings.textContent}.`);
    function draw() {
      svg.selectAll(":not(title):not(desc)").remove();
      const width = Math.max(1, plot.getBoundingClientRect().width);
      const height = 254;
      const bounds = {left: 74, right: Math.max(78, width - 12), top: 32, bottom: height - 54};
      svg.attr("viewBox", `0 0 ${width} ${height}`).attr("data-shared-domain-max", sharedDomain[1]);
      const x = d3.scaleLinear().domain(sharedDomain).range([bounds.left + 6, bounds.right - 6]);
      const y = d3.scalePoint().domain([1, 2, 3, 4]).range([bounds.top + 14, bounds.bottom - 14]);
      svg.append("rect").attr("data-chart-frame", "").attr("x", bounds.left).attr("y", bounds.top).attr("width", bounds.right - bounds.left).attr("height", bounds.bottom - bounds.top);
      svg.append("g").attr("class", "grid").attr("transform", `translate(0,${bounds.bottom})`).call(d3.axisBottom(x).ticks(width <= 400 ? 3 : 4).tickFormat("").tickSize(-(bounds.bottom - bounds.top)).tickSizeOuter(0));
      const xAxis = svg.append("g").attr("class", "axis x-axis").attr("transform", `translate(0,${bounds.bottom})`).call(d3.axisBottom(x).ticks(width <= 400 ? 3 : 4).tickSizeOuter(0));
      const xTexts = xAxis.selectAll(".tick text").nodes();
      xTexts.forEach((node, index) => d3.select(node).attr("text-anchor", index === 0 ? "start" : index === xTexts.length - 1 ? "end" : "middle"));
      svg.append("g").attr("class", "axis y-axis").attr("transform", `translate(${bounds.left},0)`).call(d3.axisLeft(y).tickFormat(position => phaseLabels[position - 1]).tickSize(0).tickPadding(8));
      svg.append("text").attr("class", "axis-title").attr("data-axis", "x").attr("x", (bounds.left + bounds.right) / 2).attr("y", height - 8).attr("text-anchor", "middle").text("계산 경과시간 (초)");
      svg.append("text").attr("class", "axis-title").attr("data-axis", "y").attr("x", bounds.left).attr("y", 15).text("ABBA 순서");
      for (const trial of block) {
        const isControl = trial.variant === "baseline";
        const pointX = x(trial.measurement.elapsed_seconds);
        const pointY = y(trial.position);
        const mark = d3.symbol().type(isControl ? d3.symbolCircle : d3.symbolDiamond).size(isControl ? 50 : 56);
        svg.append("path").attr("d", mark).attr("transform", `translate(${pointX},${pointY})`).attr("fill", isControl ? "var(--viz-series-2)" : "var(--viz-series-1)");
        const inward = pointX > bounds.right - 76;
        svg.append("text").attr("x", pointX + (inward ? -10 : 10)).attr("y", pointY + 4).attr("text-anchor", inward ? "end" : "start").text(seconds(trial.measurement.elapsed_seconds));
        const hitSize = window.matchMedia("(pointer: coarse)").matches ? 44 : 32;
        const hit = svg.append("rect").attr("class", "trial-hit cursor-interaction").attr("data-chart-hit", "").attr("x", pointX - hitSize / 2).attr("y", pointY - hitSize / 2).attr("width", hitSize).attr("height", hitSize);
        hit.on("pointermove", event => showTooltip(event, trial, svg.node())).on("pointerleave", () => { if (tooltip.dataset.pinned !== "true") tooltip.hidden = true; }).on("pointerdown", event => { if (event.pointerType === "touch") showTooltip(event, trial, svg.node(), true); });
      }
      declutter(svg);
    }
    if (typeof ResizeObserver === "function") new ResizeObserver(draw).observe(plot);
    draw();
  }
})();
</script>
