가마료(石がま漁)가 겨울에 벌어진다. 돌 틈사이로 숨어든 물고기를 봉으로 때려 이때 도망가는 물고기를 포획하는 어법이다. 현재 현 지정 무형문화재로 지정되어 있다. 지역자치회와 NPO가 전통 어법 보존에 힘쓰고 있으며 어획기간 중 이시가마 축제가 열린다.\n전설로는《고야마 부자(湖山長者)》이야기가 알려져 있다. 내용은 넓은 논을 가지고 있던 부자가 일몰까지 모심기를 끝내지 못자, 고루(高樓)에 올라가 황금 부채로 태양을 불러내어 그날 모심기를 끝냈지만, 다음날 날이 밝자 논은 모두 못으로 변해 있었다는 이야기이다.\n아오시마섬 주변에는 예부터 사람들이 모여 살아 조몬 시대부터 야요이 시대에 걸친 유적이 있다. 또, 센고쿠 시대 동쪽 호반에 이나바 슈고 관아인 후세텐진 산성이 있었고, 서쪽 호반의 반도에는 호족 요시오카 가문의 거성인 쓰즈라오성이 있었다.\n가장 가까운 역으로는 JR 산인 본선의 고야마역과 스에쓰네역, 돗토리다이가쿠마에역이 있다. 또, 돗토리다이가쿠마에 역에서 스에쓰네 역 사이를 오가는 열차의 차창사이로 고야마이케의 풍경을 볼 수 있다.\n\n## 갤러리\n- 아오시마섬\n- 네코시마섬\n- 이시가마\n\n\n## 같이 보기\n- 후세텐진 산성\n- 쓰즈라오 성\n- 이시가마료\n\n"},"step3":{"counts":{"source_lines":22,"documents_without_formula":1,"lines_after_document_filter":22,"rejected_is_structural":16,"lines_entering_clean_paragraph":6,"lines_changed_by_clean_paragraph":4,"characters_removed_by_clean_paragraph":41,"documents":1,"raw_paragraphs":6,"raw_characters":962,"clean_paragraphs":6,"clean_characters":921,"sentences":21},"paragraphs":"고야마못은 돗토리현 돗토리시 남서부에 위치한 기수호이다. 이름은 못이지만 커다란 석호다. 고대에는 만이었으나, 사구의 발달과 퇴적으로 바다에서 분리되어 석호가 되었다. 일본에서 못으로 표기된 수체들 중 고야마못이 가장 크다.\n\n둘레 16 km, 면적 6.96 km2, 최대수심 7.5 m이다. 크고 작은 섬들이 다소 떠있다. 그중 가장 큰 섬은 아오시마섬으로 호안으로부터 다리로 연결되어 있다. 벚나무가 다수 심어져 있는 도로는 도보와 자전거로 일주가 가능하며 캠프도 가능하다. 몇 곳의 하천이 유입해 고야마강을 통해 동해로 빠져나간다. 단, 수문이 있기 때문에 수질오염문제가 부상하고 있다. 돗토리시 교외의 행락지 중 하나이며 돗토리 대학에 인접해 있다.\n\n돗토리시 미쓰 지구에서는 일본에서 전국적으로 보기 드문 전통 어법 이시가마료가 겨울에 벌어진다. 돌 틈사이로 숨어든 물고기를 봉으로 때려 이때 도망가는 물고기를 포획하는 어법이다. 현재 현 지정 무형문화재로 지정되어 있다. 지역자치회와 NPO가 전통 어법 보존에 힘쓰고 있으며 어획기간 중 이시가마 축제가 열린다.\n\n전설로는《고야마 부자》이야기가 알려져 있다. 내용은 넓은 논을 가지고 있던 부자가 일몰까지 모심기를 끝내지 못자, 고루에 올라가 황금 부채로 태양을 불러내어 그날 모심기를 끝냈지만, 다음날 날이 밝자 논은 모두 못으로 변해 있었다는 이야기이다.\n\n아오시마섬 주변에는 예부터 사람들이 모여 살아 조몬 시대부터 야요이 시대에 걸친 유적이 있다. 또, 센고쿠 시대 동쪽 호반에 이나바 슈고 관아인 후세텐진 산성이 있었고, 서쪽 호반의 반도에는 호족 요시오카 가문의 거성인 쓰즈라오성이 있었다.\n\n가장 가까운 역으로는 JR 산인 본선의 고야마역과 스에쓰네역, 돗토리다이가쿠마에역이 있다. 또, 돗토리다이가쿠마에 역에서 스에쓰네 역 사이를 오가는 열차의 차창사이로 고야마이케의 풍경을 볼 수 있다.\n\n","sentences":"고야마못은 돗토리현 돗토리시 남서부에 위치한 기수호이다.\n이름은 못이지만 커 山城路)는 부산광역시 북구 화명동에서 금정구 장전동까지 이르는 부산광역시도로, 총 연장은 2.527 km이다. 또한 해당 도로는 사적 제215호로 지정된 금정산성의 명칭을 반영하여 제정된 것에서 유래하였다.\n\n## 노선 정보\n- 총 연장 : 2.527 km\n- 기점 : 부산광역시 북구 화명동 1528-5 (화명삼거리 = 금곡대로와 교차)\n- 종점 : 부산광역시 금정구 장전동 산38-42 (금샘로와 직결)\n\n\n## 개요\n1990년대 이전 당시의 구 영동고속도로와 비슷한 선형을 가지고 있는 부산 지역의 대표적인 S자형 굴곡 구간이 있는 도로이다. 그래서 급경사나 급커브가 워낙 심한 도로로 알려져 왔으며, 1981년 당시에 있었던 버스 추락 사고로 33명이 숨지는 대참사가 발생된 사건과 관련이 깊은 도로이기도 하다.\n\n## 지리\n\n### 통과하는 지자체\n- 부산광역시\n  - 북구 (화명2동) - 금정구 (금성동 - 장전1동 - 장전2동)\n\n\n### 접촉하는 도로\n- 금곡대로 (국도 제35호선)\n- 땅곡길\n- 북문로\n- 금샘로 (부산광역시도 제7102호선)\n\n\n### 주변에 있는 시설\n북구\n- 화신중학교\n- 북부산농협 화명지점\n- 부산광역시 북구보건소\n- 산성중앙교회\n- 파스쿠찌 부산화명산성점\n- 명한의원\n- 화명푸르지오헤리센트아파트\n- CU 화명산성로점\n- 지코바치킨 화명1호점\n- 대우마트\n- 금화횟집\n- 화명평화도서관\n- 주원교회\n- 축복교회\n- 화명장원맨션\n- 산성슈퍼\n- 웅진빌라\n- 키즈킹덤어린이집\n- 대천리중학교\n- 대천리초등학교\n- 그린숲속아파트\n- 심우촌\n- 대천천누리길\n- 화명 수목원 전시실\n\n금정구\n- 금정산성 서문\n- 산성119안전센터\n- 오리방\n- 낙원집\n- 카페지수\n- 산성상회\n- 산성마루\n- 헤이든신씨어\n- 금성어린이집\n- 인제약국\n- 산성교회\n- 북경반점\n- 청사초롱\n- 금성동행정복지센터\n- 산성막걸리\n- 과수원\n- 카페26\n- 초가농장\n- 놀이체험도서관빅뱅\n- 일월농장\n- 녹색의장원\n- 현대가든\n- 산성청송가든\n- 금정산성다목적광장\n- 공해마을회관\n- 금호장\n- 산성버스\n- 산자락가든\n- 솔밭집\n- 동래양로원\n\n"},"step3":{"counts":{"source_lines":86,"documents_without_formula":1,"lines_after_document_filter":86,"rejected_is_structural":82,"lines_entering_clean_paragraph":4,"lines_changed_by_clean_paragraph":1,"characters_removed_by_clean_paragraph":5,"rejected_is_sentence_shape":2,"documents":1,"raw_paragraphs":4,"raw_characters":290,"clean_paragraphs":2,"clean_characters":280,"sentences":4},"paragraphs":"산성로는 부산광역시 북구 화명동에서 금정구 장전동까지 이르는 부산광역시도로, 총 연장은 2.527 km이다. 또한 해당 도로는 사적 제215호로 지정된 금정산성의 명칭을 반영하여 제정된 것에서 유래하였다.\n\n1990년대 이전 당시의 구 영동고속도로와 비슷한 선형을 가지고 있는 부산 지역의 대표적인 S자형 굴곡 구간이 있는 도로이다. 그래서 급경사나 급커브가 워낙 심한 도로로 알려져 왔으며, 1981년 당시에 있었던 버스 추락 사고로 33명이 숨지는 대참사가 발생된 사건과 관련이 깊은 도로이기도 하다.\n\n","sentences":"산성로는 부산광역시 북구 화명동에서 금정구 장전동까지 이르는 부산광역시도로, 총 연장은 2.527 km이다.\n또한 해당 도로는 사적 제215호로 지정된 금정산성의 명칭을 반영하여 제정된 것에서 유래하였다.\n\n1990년대 이전 당시의 구 영동고속도로와 비슷한 선형을 가지고 있는 부산 지역의 대표적인 rejected":false}},{"id":"kowiki/303062","title":"신뢰 구간","source_file":"parquet/data/kowiki/000_00000.parquet","step2_file":"examples/kowiki-303062.text.txt","step1_row":{"text":"# 신뢰 구간\n\n통계학에서 신뢰 구간(信賴區間, 영어: confidence interval)은 모수가 어느 범위 안에 있는지를 확률적으로 보여주는 방법이다.\n신뢰 구간은 보통 표본에서 산출된 통계와 함께 제공된다. 예를 들어, \"신뢰수준 95%에서 투표자의 35%~45%가 A후보를 지지하고 있다.\"라고 할 때 95%는 신뢰수준이고 35%~45%는 신뢰구간이며 θ는 A후보의 지지율이다.\n\n## 정의\n0과 1 사이의 실수 {\\displaystyle \\gamma \\in [0,1]}가 주어졌다고 하자. 또한, 각 모수 {\\displaystyle \\theta \\in \\Theta }에 대한 확률 변수 {\\displaystyle X_{\\theta }}가 주어졌다고 하자. 이 경우, {\\displaystyle \\theta }의, 신뢰계수(信賴係數, 영어: confidence coefficient) {\\displaystyle \\gamma }의 신뢰 구역 {\\displaystyle I_{\\theta }\\subset \\Theta }는 다음과 같은 성질을 가지는, {\\displaystyle \\Theta }의 부분집합의 값을 갖는 확률변수이다.\n{\\displaystyle \\forall \\theta \\in I\\colon \\Pr(\\theta \\in I_{\\theta })=\\gamma }\n만약 하나만의 확률 변수 {\\displaystyle \\theta \\in \\mathbb {R} }를 고려할 경우, 보통 {\\displaystyle I_{\\theta }}는 구간이 된다. 이 경우, {\\displaystyle I_{\\theta }}를 신뢰 구간이라고 한다.\n보통, 신뢰 수준(信賴水準, 영어: confidence level)은 신뢰 계수를 백분율로 나타낸 것이다.\n\n## 같이 보기\n- 68-95-99.7 규칙\n- 신용 구간\n- 허용 오차\n- 예측구간\n\n"},"step3":{"counts":{"source_lines":18,"rejected_has_formula":1,"source_lines_in_formula_documents":18,"documents":1,"raw_paragraphs":0,"raw_characters":0,"clean_paragraphs":0,"clean_characters":0,"sentences":0},"paragraphs":"","sentences":"","document_rejected":true}}]}</script>

      const selected = name === value;
      $('kw-tab-' + name).classList.toggle('active', selected);
      $('kw-tab-' + name).setAttribute('aria-selected', String(selected));
      $('kw-' + name).hidden = !selected;
    }
  }
  const overview = [
    ['수식 포함 문서 제외', n(counts.rejected_has_formula) + '개 · ' + pct(data.filters[0].removed_percent), '전체 ' + n(counts.documents) + '개 문서 기준'],
    ['본문행 추가 제외', n(data.content_paragraphs_removed) + '개 · ' + pct(data.content_paragraphs_removed_percent), '구조 행 제외 후 ' + n(counts.raw_paragraphs) + '개 기준'],
    ['중복 문장 제외', n(data.step4.removed_sentences) + '개 · ' + pct(data.step4.removed_percent), '분리된 ' + n(data.step4.input_sentences) + '개 문장 기준']
  ];
  for (const [label, value, base] of overview) {
    const section = add($('kw-overview'), 'div', '', 'kw-example');
    add(section, 'div', label, 'text-small');
    add(section, 'div', value, 'kw-label tabular-nums');
    add(section, 'div', base, 'text-small');
  }
  for (const item of data.filters) {
    const row = document.createElement('tr');
    add(row, 'td', item.number + '. ' + shortLabels[item.number - 1]);
    add(row, 'td', n(item.removed) + (item.number === 1 ? '개 문서' : '행'), 'text-end');
    add(row, 'td', pct(item.removed_percent), 'text-end');
    $('kw-filter-counts').append(row);
  }
  for (const text of [
    '분모: 1번은 전체 ' + n(counts.documents) + '개 문서, 2번은 수식 문서 제외 후 ' + n(counts.lines_after_document_filter) + '행, 3~8번은 구조 행 제외 후 ' + n(counts.raw_paragraphs) + '개 본문행.',
    '5번의 괄호·공백 변경: ' + n(counts.lines_changed_by_clean_paragraph) + '행 (' + pct(counts.lines_changed_by_clean_paragraph / counts.lines_entering_clean_paragraph * 100) + ', 정리에 진입한 행 기준). 그중 빈 행이 된 ' + n(counts.rejected_clean_paragraph) + '행만 제외 수에 포함됩니다.',
    '정제 문단 ' + n(counts.clean_paragraphs) + '개 → 문장 분리 ' + n(counts.sentences) + '개 → 중복 제거 후 ' + n(data.step4.kept_sentences) + '개.',
    '중복 기준: NFKC·공백 정리 후 완전 일치. 영문 대소문자는 구분합니다. 각 행은 처음 탈락한 사유에 한 번만 집계합니다.'
  ]) add($('kw-count-notes'), 'div', text);
  set('kw-all-lines', '원문행 ' + n(counts.source_lines) + '개 → 정제 문단 ' + n(counts.clean_paragraphs) + '개\n제외 ' + n(data.source_lines_removed) + '행 (' + pct(data.source_lines_removed_percent) + ')\n빈 행·제목·목록·표와 수식 문서 안의 행을 포함한 수치입니다.');

  data.filters.forEach(item => {
    const option = add($('kw-case-select'), 'option', item.number + ' · ' + shortLabels[item.number - 1]);
    option.value = String(item.number);
  });
  for (const [value, label] of [['9', '중복 문장 · 가장 많이 반복된 실제 사례'], ['10', '예외 처리 · 괄호·이니셜 검증 예시']]) {
    const option = add($('kw-case-select'), 'option', label);
    option.value = value;
  }
  function showCase(value) {
    state.filter = String(value);
    $('kw-case-select').value = state.filter;
    $('kw-case-full').hidden = true;
    $('kw-case-full').open = false;
    set('kw-case-extra', '');
    set('kw-before-label', '원문');
    if (Number(value) <= 8) {
      const item = data.filters[Number(value) - 1], example = item.example;
      set('kw-case-source', example.source.title + ' · ' + example.source.id + (example.line ? ' · 원문 ' + example.line + '행' : ''));
      set('kw-case-rule', item.label);
      let before = example.before;
      if (Number(value) === 1) before = before.split('\n').find(line => line.includes('{\\displaystyle'));
      if (Number(value) === 3 && before.length > 350) {
        const hit = before.search(/[±∓≠≤≥∈∪∑√∞]/);
        before = '…' + before.slice(Math.max(0, hit - 75), hit + 85) + '…';
      }
      if (before !== example.before) {
        set('kw-before-label', '원문 발췌');
        $('kw-case-full').hidden = false;
        set('kw-case-full-text', example.before);
      }
      set('kw-before', before);
      set('kw-after', Number(value) === 5 ? example.after : Number(value) === 1 ? '문서 전체 제외' : '해당 행 제외');
      let extra = n(item.removed) + (Number(value) === 1 ? '개 문서' : '행') + ' 제외 · ' + pct(item.removed_percent) + ' (' + item.denominator_label + ' ' + n(item.denominator) + '개 기준)';
      if (item.example_ratio_percent !== undefined) extra += '\n이 사례의 비율: ' + pct(item.example_ratio_percent);
      if (item.emptied_example) extra += '\n행 전체가 빈 경우도 존재: ' + item.emptied_example.source.title + '\n' + item.emptied_example.before + ' → 빈 행으로 제외';
      if (Number(value) === 2) {
        const table = data.samples.find(sample => sample.id === 'kowiki/660723');
        const line = table?.step1_row.text.split('\n').find(text => text.startsWith('|'));
        if (line) extra += '\n표 행의 실제 사례: 광주동부소방서\n' + line + ' → 해당 행 제외';
      }
      set('kw-case-extra', extra);
    } else if (Number(value) === 9) {
      const example = data.step4.top_duplicates[0];
      set('kw-case-source', '전체 32개 파일 통합 · ' + n(data.step4.duplicate_groups) + '종류에서 중복 발견');
      set('kw-case-rule', '정규화 후 같은 문장은 최초 1회만 보존');
      set('kw-before', example.text + '\n\n총 ' + n(example.occurrences_before) + '회 등장');
      set('kw-after', example.text + '\n\n1회 보존 · ' + n(example.removed) + '회 제외');
      set('kw-case-extra', '전체 문장 ' + n(data.step4.input_sentences) + '개 중 ' + n(data.step4.removed_sentences) + '개 제외 (' + pct(data.step4.removed_percent) + ')');
    } else {
      const cases = data.validated_examples;
      set('kw-case-source', '요청한 예외 처리를 확인하기 위한 인공 검증 예시');
      set('kw-case-rule', '한글·숫자 괄호 보존 / 이니셜 뒤에서 갈라진 문장 합치기');
      set('kw-before', cases.parentheses.before + '\n\n' + cases.initials.before);
      set('kw-after', cases.parentheses.after + '\n\n' + cases.initials.after.join('\n'));
    }
  }

  data.samples.forEach((sample, index) => {
    const option = add($('kw-doc-select'), 'option', sample.title + ' · ' + sample.id);
    option.value = String(index);
  });
  set('kw-schema-list', data.step1.columns.map(column => column.name + ': ' + column.type).join('\n'));
  function showSample(index, stage) {
    state.sample = String(index);
    state.stage = stage;
    $('kw-doc-select').value = state.sample;
    $('kw-stage-select').value = stage;
    const sample = data.samples[Number(index)], c = sample.step3.counts;
    let text, metrics;
    if (stage === '1' || stage === '2') {
      text = sample.step1_row.text;
      metrics = stage === '1' ? 'Parquet의 14개 열 중 text · ' + n([...text].length) + '자' : 'text만 추출한 UTF-8 TXT · 원본 text와 바이트 단위 일치';
    } else {
      text = stage === '3p' ? sample.step3.paragraphs : sample.step3.sentences;
      metrics = '본문행 ' + n(c.raw_paragraphs || 0) + '개 → 정제 문단 ' + n(c.clean_paragraphs || 0) + '개 → 문장 ' + n(c.sentences || 0) + '개';
      if (sample.step3.document_rejected) text = '수식 포함 문서이므로 1번 필터에서 문서 전체 제외.';
      else if (!text) text = '모든 행이 필터에서 제외되었습니다.';
    }
    const path = stage === '1' ? sample.source_file : stage === '2' ? sample.step2_file : 'reports/examples/' + sample.id.replace('/', '-') + (stage === '3p' ? '.paragraphs.txt' : '.sentences.txt');
    set('kw-stage-source', sample.title + ' · ' + path);
    set('kw-stage-metrics', metrics);
    set('kw-stage-text', text);
    $('kw-schema').hidden = stage !== '1';
  }
  for (const name of ['counts', 'cases', 'stages']) $('kw-tab-' + name).addEventListener('click', () => { tab(name); save(); });
  $('kw-case-select').addEventListener('change', event => { showCase(event.target.value); save(); });
  $('kw-doc-select').addEventListener('change', event => { showSample(event.target.value, state.stage); save(); });
  $('kw-stage-select').addEventListener('change', event => { showSample(state.sample, event.target.value); save(); });
  window.addEventListener('openai:set_globals', event => {
    const saved = event.detail?.globals?.widgetState?.privateContent;
    if (!saved) return;
    if (['counts', 'cases', 'stages'].includes(saved.tab)) tab(saved.tab);
    if (/^(?:[1-9]|10)$/.test(saved.filter)) showCase(saved.filter);
    if (/^[0-4]$/.test(saved.sample) && ['1', '2', '3p', '3s'].includes(saved.stage)) showSample(saved.sample, saved.stage);
  });
  // 모든 선택 항목이 실제 결과로 표시되는지 확인한 뒤 사용자의 선택으로 복원한다.
  const initial = { ...state };
  for (let i = 1; i <= 10; i++) {
    showCase(String(i));
    if (!$('kw-before').textContent || !$('kw-after').textContent) throw new Error('Empty case: ' + i);
  }
  for (let i = 0; i < data.samples.length; i++) {
    for (const stage of ['1', '2', '3p', '3s']) {
      showSample(String(i), stage);
      if (!$('kw-stage-text').textContent) throw new Error('Empty sample: ' + i + '/' + stage);
      if (stage === '2' && $('kw-stage-text').textContent !== data.samples[i].step1_row.text) throw new Error('Step 2 changed the source');
    }
  }
  tab(initial.tab);
  showCase(initial.filter);
  showSample(initial.sample, initial.stage);
  window.kwReview = { tab, showCase, showSample };
  console.info('Review checks passed: 10 cases, 5 documents × 4 stage views.');
})();
</script>
