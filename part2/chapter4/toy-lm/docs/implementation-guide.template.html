<style>
#implementation-guide { color:var(--foreground); font-family:var(--font-sans); font-size:var(--font-size-base,14px); overflow-wrap:anywhere; }
#implementation-guide h3 { margin:0 0 14px; font-weight:500; }
#implementation-guide [data-title] { margin-top:20px; }

#implementation-guide .code-field { display:grid; grid-template-columns:minmax(0,1fr); gap:7px; min-width:0; margin:10px 0; }

#implementation-guide .diagram { display:block; width:100%; }
#implementation-guide .diagram text { fill:var(--foreground); }
#implementation-guide .prose p { margin:10px 0; }
#implementation-guide ul { padding-left:22px; }
#implementation-guide li { margin:8px 0; }

#implementation-guide .snippet-label { font-weight:500; margin:14px 0 7px; }
#implementation-guide .source-range,#implementation-guide .summary { color:var(--muted-foreground); margin:7px 0; }
