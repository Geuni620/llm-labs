<script>// 이 실습에서 필요한 SVG 생성·좌표 변환·축·경로만 직접 구현한다.
// 브라우저에서는 전역 객체 NplmSvg로 사용한다.
(() => {
  'use strict';
  const namespace = 'http://www.w3.org/2000/svg';
  function set(node, attributes) {
    for (const [name, value] of Object.entries(attributes)) {
      if (value === null || value === undefined) node.removeAttribute(name);
      else node.setAttribute(name, String(value));
    }
    return node;
  }
  function add(parent, name, attributes = {}, text) {
    const node = document.createElementNS(namespace, name);
    set(node, attributes);
    if (text !== undefined) node.textContent = String(text);
    parent.append(node);
    return node;
  }
  function range(count) {
    if (!Number.isInteger(count) || count < 0) throw new Error('개수는 0 이상의 정수여야 합니다.');
    return Array.from({ length: count }, (_, i) => i);
  }
  function extent(values, accessor = value => value) {
    let minimum = Infinity, maximum = -Infinity;
    for (let i = 0; i < values.length; i++) {
      const value = accessor(values[i], i);
      if (!Number.isFinite(value)) throw new Error('좌표에는 유한한 숫자가 필요합니다.');
      minimum = Math.min(minimum, value); maximum = Math.max(maximum, value);
    }
    if (minimum === Infinity) throw new Error('좌표 범위를 구할 데이터가 없습니다.');
    return [minimum, maximum];
  }
  function linear(domain, output) {
    const [d0, d1] = domain, [r0, r1] = output;
    if (![d0,d1,r0,r1].every(Number.isFinite)) throw new Error('좌표 변환 범위는 유한해야 합니다.');
    const scale = value => d0 === d1 ? (r0+r1)/2 : r0+(value-d0)/(d1-d0)*(r1-r0);
    scale.invert = value => r0 === r1 ? (d0+d1)/2 : d0+(value-r0)/(r1-r0)*(d1-d0);
    return scale;
  }
  function niceDomain(minimum, maximum, count = 5) {
    if (!Number.isFinite(minimum) || !Number.isFinite(maximum) || minimum > maximum || !Number.isInteger(count) || count < 2) throw new Error('축 범위가 잘못되었습니다.');
    if (minimum === maximum) { minimum -= 1; maximum += 1; }
    if (count === 2) return { domain:[minimum,maximum], ticks:[minimum,maximum] };
    const raw = (maximum-minimum)/(count-1);
    const power = 10 ** Math.floor(Math.log10(raw));
    const unit = [1,2,2.5,5,10].find(value => value*power >= raw) ?? 10;
    let step = unit*power;
    let first = Math.floor(minimum/step)*step, last = Math.ceil(maximum/step)*step;
    // 눈금이 너무 많으면 간격을 키운다. 좁은 화면에서도 요청한 개수를 넘기지 않는다.
    while (Math.round((last-first)/step)+1 > count) {
      step *= 2;
      first = Math.floor(minimum/step)*step; last = Math.ceil(maximum/step)*step;
    }
    const number = Math.round((last-first)/step);
    const ticks = Array.from({ length: number+1 }, (_, i) => Number((first+i*step).toPrecision(12)));
    return { domain:[ticks[0],ticks.at(-1)], ticks };
  }
  function nearestIndex(values, score) {
    let index = -1, best = Infinity;
    for (let i=0;i<values.length;i++) { const value=score(values[i],i);if(value<best){best=value;index=i;} }
    return index;
  }
  function maxIndex(values) { return nearestIndex(values, value => -value); }
  function path(points) {
    return points.map((point,i) => {
      if (point.length !== 2 || !point.every(Number.isFinite)) throw new Error('경로 좌표가 잘못되었습니다.');
      return `${i===0?'M':'L'}${point[0]},${point[1]}`;
    }).join(' ');
  }
  function format(value) {
    if (Math.abs(value)<1e-10) return '0';
    return Number(value.toFixed(3)).toString();
  }
  function bottomAxis(svg, scale, values, bottom, formatter = format) {
    const group=add(svg,'g',{'data-axis-ticks':'x'});
    values.forEach((value,i) => {
      const x=scale(value);
      add(group,'line',{x1:x,x2:x,y1:bottom,y2:bottom+5,stroke:'var(--border)'});
      add(group,'text',{x,y:bottom+20,'text-anchor':i===0?'start':i===values.length-1?'end':'middle'},formatter(value));
    });
    return group;
  }
  function leftAxis(svg, scale, values, left, formatter = format) {
    const group=add(svg,'g',{'data-axis-ticks':'y'});
    values.forEach(value => {
      const y=scale(value);
      add(group,'line',{x1:left-5,x2:left,y1:y,y2:y,stroke:'var(--border)'});
      add(group,'text',{x:left-9,y:y+4,'text-anchor':'end'},formatter(value));
    });
    return group;
  }
  function pointer(event, svg) {
    const bounds=svg.getBoundingClientRect();
    const box=svg.viewBox?.baseVal;
    const width=box?.width || bounds.width, height=box?.height || bounds.height;
    return [(event.clientX-bounds.left)*width/bounds.width+(box?.x??0),
      (event.clientY-bounds.top)*height/bounds.height+(box?.y??0)];
  }
  globalThis.NplmSvg = Object.freeze({add,set,range,extent,linear,niceDomain,nearestIndex,maxIndex,path,format,bottomAxis,leftAxis,pointer});
})();

<script>const chapter4GuideData={"sections":[{"title":"전체 구조와 외부 의존성","kind":"branches","nodes":[["데이터","6문장 → 24쌍"],["트라이그램","횟수로 확률 계산"],["NPLM","가중치로 확률 계산"],["문장 생성","확률에 비례해 추첨"],["결과 기록","표·그래프·재생"]],"paragraphs":["언어는 TypeScript이고 실행 환경은 Node.js입니다. Node가 .ts 파일의 타입 표기를 지우고 실행합니다. TypeScript 컴파일러는 별도의 타입 검사에만 사용합니다.","같은 24개 학습 문제를 트라이그램과 NPLM에 제공합니다. 두 모델은 입력 두 토큰으로 다음 토큰의 확률을 계산한다는 인터페이스를 공유합니다. 이후 생성·분류·집계 코드는 함께 사용합니다.","모델 계산에는 처음부터 외부 딥러닝 라이브러리를 쓰지 않았습니다. 시각화에 사용했던 D3는 제거했고, SVG 생성·좌표 변환·축·경로·재생도 직접 구현했습니다."],"bullets":["실행·학습·시각화용 외부 패키지: 0개. React·차트 라이브러리·자동 미분 라이브러리를 사용하지 않습니다.","요청대로 개발 도구 TypeScript와 @types/node는 유지합니다. 이들의 개발용 전이 의존성도 포함됩니다.","node:fs, node:path, node:zlib 등은 Node 기본 모듈입니다. Math·Float64Array·Map·SVG·requestAnimationFrame은 실행 환경의 기본 기능입니다."],"snippets":[{"file":"package.json","anchor":"\"scripts\": {","lines":15,"label":"Node가 실행하는 명령과 개발 전용 도구","start":8,"end":22,"code":"  \"scripts\": {\n    \"data\": \"node src/cli.ts data\",\n    \"trigram\": \"node src/cli.ts trigram\",\n    \"trace\": \"node src/cli.ts trace\",\n    \"compare\": \"node src/cli.ts compare\",\n    \"animate\": \"node src/animate.ts\",\n    \"explain\": \"node scripts/build-guide.ts\",\n    \"typecheck\": \"tsc --noEmit\",\n    \"gradcheck\": \"node scripts/gradcheck.ts\"\n  },\n  \"devDependencies\": {\n    \"@types/node\": \"24.19.2\",\n    \"typescript\": \"7.0.2\"\n  }\n}"}]},{"title":"data.ts — 6문장을 24개 학습 문제로","nodes":[["문장","철수는 사과를 좋아해"],["토큰 ID","문자열을 번호로"],["경계 표시","pad·bos·eos"],["학습 쌍","문맥 2개 → 정답 1개"]],"paragraphs":["일반 단어는 주체 3개·과일 3개·동사 2개로 총 8개입니다. 패딩 \u003cpad>, 문장 시작 \u003cbos>, 문장 끝 \u003ceos>를 더해 출력 후보는 11개입니다. ID는 단어를 가리키는 번호이며 임베딩 좌표나 확률이 아닙니다.","철수는 사과를 좋아해 앞뒤에 표시를 붙이면 [pad, bos, 철수는, 사과를, 좋아해, eos]가 됩니다. 두 칸씩 문맥을 읽고 바로 다음 칸을 정답으로 삼습니다.","한 문장에서 4쌍이 나오므로 6문장에서 24쌍이 됩니다. 문장 경계를 넘어서 서로 다른 문장을 이어 붙이지 않습니다."],"bullets":["(pad, bos) → 철수는 / (bos, 철수는) → 사과를 / (철수는, 사과를) → 좋아해 / (사과를, 좋아해) → eos.","번호는 같게 유지하고, 학습 중에는 그 번호로 찾아오는 임베딩 숫자가 바뀝니다.","원본 6문장을 유지합니다. 탐색용 철수는+바나나를 조합은 학습 쌍에 추가하지 않습니다."],"snippets":[{"file":"data/data.ts","anchor":"const pairs: Pair[] = [];","lines":9,"label":"두 토큰에서 다음 토큰을 맞히는 문제 만들기","start":47,"end":55,"code":"  const pairs: Pair[] = [];\n  for (const sentence of words) {\n    const sequence = [PAD, BOS, ...sentence, EOS].map((word) => ids.get(word)!);\n    for (let i = 0; i \u003c sequence.length - 2; i++) {\n      pairs.push({ context: [sequence[i], sequence[i + 1]], target: sequence[i + 2] });\n    }\n  }\n  return { sentences: words.map((words) => words.join(' ')), tokens, ids, pairs };\n}"},{"file":"data/data.ts","anchor":"export const SENTENCES = [","lines":8,"label":"실제 학습 문장 6개","start":9,"end":16,"code":"export const SENTENCES = [\n  '철수는 사과를 좋아해',\n  '철수는 딸기를 좋아해',\n  '영희는 사과를 좋아해',\n  '영희는 딸기를 좋아해',\n  '영희는 바나나를 좋아해',\n  '짱구는 바나나를 싫어해',\n] as const;"}]},{"title":"trigram.ts — MLE와 add-k","nodes":[["문맥 2개","bos + 철수는"],["등장 횟수","사과 1·딸기 1"],["보정 선택","그대로 / 모든 횟수+k"],["확률","횟수 ÷ 분모"]],"paragraphs":["fit은 각 문맥 뒤에 어떤 토큰이 몇 번 나왔는지 Map과 배열에 셉니다. 트라이그램은 신경망의 가중치를 학습하지 않으므로 역전파나 경사하강법을 사용하지 않습니다.","MLE는 관측 횟수를 문맥 전체 횟수로 나눕니다. add-k는 모든 후보 횟수에 같은 k를 더하고, 분모에도 k×어휘 수를 더합니다. 따라서 add-k를 적용한 모델도 트라이그램입니다.","한 번도 본 적 없는 문맥에서 MLE는 미정으로 표시합니다. k가 양수라면 그 문맥에서 11개 후보가 균등해집니다."],"bullets":["bos+철수는 다음에는 사과를·딸기를 각각 1회 관측했습니다. MLE는 각각 1/2입니다.","k=0.01이면 분모는 2+0.01×11=2.11입니다. 사과를은 1.01/2.11≈47.87%, 바나나를은 0.01/2.11≈0.47%입니다.","스무딩은 원하는 단어에 임의로 확률을 얹는 학습이 아닙니다. 여기서는 분포를 균등 분포 쪽으로 당기는 고정 계산 규칙입니다."],"formula":"MLE = count / contextCount\nadd-k = (count + k) / (contextCount + k × V)","snippets":[{"file":"trigram/trigram.ts","anchor":"distribution(context: Context, k = 0)","lines":16,"label":"실제 MLE·add-k 확률 계산","start":48,"end":63,"code":"  distribution(context: Context, k = 0): Distribution {\n    if (!Number.isFinite(k) || k \u003c 0) throw new Error('k는 0 이상의 유한한 값이어야 합니다.');\n    const key = this.key(context);\n    const counts = Array.from(this.counts.get(key) ?? new Float64Array(this.vocabularySize));\n    const contextCount = this.totals.get(key) ?? 0;\n    const denominator = contextCount + k * this.vocabularySize;\n    return {\n      contextCount, counts, k, denominator,\n      // MLE의 미관측 문맥은 미정이다. add-k의 균등 분포와 구분한다.\n      probabilities: denominator === 0 ? null : counts.map((count) => (count + k) / denominator),\n    };\n  }\n\n  evaluate(pairs: readonly Pair[], k = 0): Evaluation {\n    if (pairs.length === 0) throw new Error('평가 쌍이 필요합니다.');\n    let totalLoss = 0;"}]},{"title":"math.ts — 난수·softmax·추첨의 기본 계산","nodes":[["출력 점수","음수도 가능한 숫자"],["최댓값 빼기","exp 범위 안정화"],["exp와 합","양수로 변환"],["정규화","합이 1인 확률"]],"paragraphs":["모델은 처음부터 확률을 출력하지 않고 후보별 점수인 logit을 만듭니다. softmax가 exp를 취한 뒤 합으로 나누어 확률로 바꿉니다. 최댓값을 먼저 빼도 결과 확률은 같고, 지나치게 큰 exp 계산을 피할 수 있습니다.","randomGenerator는 seed로 재현 가능한 의사난수를 만들고, normal은 Box–Muller 식으로 정규분포 초기값을 만듭니다. 외부 난수·수학 패키지를 불러오지 않습니다.","sample은 확률의 누적합과 난수 티켓을 비교합니다. 예를 들어 [0.6,0.4]라면 티켓이 0.6보다 작을 때 첫 후보, 그 이후에는 둘째 후보를 고릅니다."],"bullets":["점수 0.6·0.4를 softmax에 넣으면 약 54.98%·45.02%입니다. 이미 확률 60%·40%인 값을 다시 softmax에 넣는 것과 구분합니다.","Math.exp·Math.log·Math.tanh는 JavaScript의 기본 수학 함수입니다. 행렬 라이브러리나 텐서 엔진은 쓰지 않습니다.","같은 seed와 같은 계산 순서를 사용하면 같은 초기값과 추첨 결과를 재현할 수 있습니다."],"snippets":[{"file":"src/math.ts","anchor":"export function softmax","lines":13,"label":"직접 구현한 안정적인 softmax","start":29,"end":41,"code":"export function softmax(logits: ArrayLike\u003cnumber>): Float64Array {\n  positiveInteger(logits.length, '출력 크기');\n  let maximum = -Infinity;\n  for (let i = 0; i \u003c logits.length; i++) {\n    if (!Number.isFinite(logits[i])) throw new Error('logit은 유한한 값이어야 합니다.');\n    maximum = Math.max(maximum, logits[i]);\n  }\n  const probabilities = new Float64Array(logits.length);\n  let sum = 0;\n  for (let i = 0; i \u003c logits.length; i++) {\n    probabilities[i] = Math.exp(logits[i] - maximum);\n    sum += probabilities[i];\n  }"},{"file":"src/math.ts","anchor":"const threshold = draw * total;","lines":8,"label":"누적 확률로 다음 후보 추첨","start":71,"end":78,"code":"  const threshold = draw * total;\n  let cumulative = 0;\n  for (let i = 0; i \u003c probabilities.length; i++) {\n    cumulative += probabilities[i];\n    if (threshold \u003c cumulative) return i;\n  }\n  return lastPositive;\n}"}]},{"title":"nlm.ts — 학습하는 숫자와 완전연결 구조","nodes":[["E 임베딩 표","11 × 2 = 22"],["입력 벡터","2단어 × 2차원 = 4"],["은닉층","4 × 8 연결"],["출력층","8 × 11 연결"]],"paragraphs":["대표 설정은 어휘 V=11, 임베딩 D=2, 은닉 뉴런 H=8입니다. E는 모든 단어가 공유하는 임베딩 표입니다. 단어 두 개의 행을 가져와 이어 붙인 입력 크기는 2D=4입니다.","W1은 입력의 모든 성분과 모든 은닉 뉴런을 연결하고, W2는 모든 은닉 뉴런과 모든 출력 후보를 연결합니다. 둘 다 완전연결층입니다. b1과 b2는 각 뉴런 계산에 더해지는 편향입니다.","행렬은 Float64Array 하나에 행 단위로 펼쳐 저장합니다. W1[i×H+h]는 입력 성분 i에서 은닉 뉴런 h로 가는 가중치입니다."],"bullets":["E: 22개 / W1: 32개 / b1: 8개 / W2: 88개 / b2: 11개. 총 161개 숫자를 학습합니다.","H=6으로 바꾸면 입력→은닉 연결은 4×6=24개입니다. 6개로 고정한 구조는 아닙니다.","같은 단어는 입력의 첫 번째·두 번째 위치에서 같은 E 행을 사용합니다."],"snippets":[{"file":"nplm/nlm.ts","anchor":"this.parameters = {","lines":7,"label":"다섯 종류의 학습 변수 초기화","start":30,"end":36,"code":"    this.parameters = {\n      E: weights(vocabularySize * dimension, 0.5),\n      W1: weights(2 * dimension * hiddenSize, Math.sqrt(2 / (2 * dimension + hiddenSize))),\n      b1: new Float64Array(hiddenSize),\n      W2: weights(hiddenSize * vocabularySize, Math.sqrt(2 / (hiddenSize + vocabularySize))),\n      b2: new Float64Array(vocabularySize),\n    };"}]},{"title":"출력 뉴런은 왜 11개인가?","nodes":[["입력 단어","철수는·사과를 2개"],["임베딩 입력","2차원 × 2개 = 4값"],["은닉 뉴런","설계로 정한 8개"],["출력 뉴런","후보 토큰 11개"]],"paragraphs":["우리처럼 다음 토큰을 softmax로 예측하는 언어 모델의 출력 뉴런 수는 어휘 크기 V로 정해집니다. V는 지금 입력한 두 단어의 개수가 아니라, 학습 데이터로 구성한 어휘표 전체의 크기입니다.","이 데이터에는 일반 단어 8개와 특수 토큰 3개가 있으므로 V=11입니다. 입력이 철수는·사과를 두 단어이고 임베딩이 2차원이어도 출력은 11개입니다. 두 단어를 2차원으로 바꾼 결과는 은닉층에 들어가는 숫자 4개입니다.","같은 신경망이 문장의 모든 위치를 예측합니다. 시작에서는 주체, 그다음에는 과일, 이어서 동사, 마지막에는 eos가 필요하므로 동사 두 개만 출력하는 구조로 만들지 않았습니다.","각 출력 뉴런은 후보 하나의 점수를 만듭니다. 11개 점수를 확률로 바꾸고 그중 다음 토큰 하나를 추첨합니다. 한 번에 단어 11개를 생성한다는 뜻은 아닙니다."],"bullets":["임베딩 차원 D: 한 단어를 몇 개의 숫자로 나타낼지 정합니다.","은닉 뉴런 수 H: 설계자가 정하는 모델 크기입니다. 어휘 8개와 은닉 8개가 같아야 하는 규칙은 없습니다.","출력 후보 수 V: 모델이 예측할 토큰 종류 수입니다. 어휘가 100개인 같은 방식의 언어 모델이면 출력 뉴런도 100개입니다.","좋아해·싫어해 두 종류만 분류하는 별도 문제라면 softmax 출력 2개로 설계할 수 있습니다. 현재는 문장 전체의 다음 토큰을 생성하므로 모든 11개 후보를 사용합니다."],"snippets":[{"file":"src/experiment.ts","anchor":"const model = new NeuralLanguageModel(dataset.tokens.length","lines":1,"label":"데이터의 전체 토큰 종류 수를 모델에 전달","start":111,"end":111,"code":"        const model = new NeuralLanguageModel(dataset.tokens.length, dimension, settings.hidden, seed);"},{"file":"nplm/nlm.ts","anchor":"const logits = new Float64Array(V);","lines":7,"label":"어휘 수 V만큼 출력 점수를 만드는 실제 반복문","start":64,"end":70,"code":"    const logits = new Float64Array(V);\n    for (let v = 0; v \u003c V; v++) {\n      let value = b2[v];\n      for (let h = 0; h \u003c H; h++) value += hidden[h] * W2[h * V + v];\n      logits[v] = value;\n    }\n    return { input, hiddenInput, hidden, logits, probabilities: softmax(logits) };"}]},{"title":"nlm.ts — 순전파: 임베딩에서 확률까지","nodes":[["단어 ID","철수는·사과를"],["임베딩 조회","두 벡터 이어 붙이기"],["은닉 계산","tanh(xW1+b1)"],["출력 점수","hW2+b2"],["확률","softmax"]],"paragraphs":["forward는 입력에서 출력 방향으로 계산합니다. 먼저 두 ID에 해당하는 E의 행을 복사해 길이 2D의 input을 만듭니다.","각 은닉 뉴런은 입력 4개를 모두 가중합하고 편향을 더한 뒤 tanh를 적용합니다. tanh의 결과는 -1~1 범위지만, E의 임베딩 좌표가 이 범위에 제한되는 것은 아닙니다.","출력층은 은닉 값 8개를 후보마다 다른 가중치로 합쳐 logit 11개를 만듭니다. softmax 결과가 다음 토큰 확률 벡터입니다."],"formula":"x = concat(E[앞 단어], E[뒤 단어])\nh = tanh(x W1 + b1)\nz = h W2 + b2\np = softmax(z)","snippets":[{"file":"nplm/nlm.ts","anchor":"const input = new Float64Array(2 * D);","lines":19,"label":"배열과 반복문으로 임베딩·은닉층·출력층 계산","start":52,"end":70,"code":"    const input = new Float64Array(2 * D);\n    for (let position = 0; position \u003c 2; position++) {\n      for (let d = 0; d \u003c D; d++) input[position * D + d] = E[context[position] * D + d];\n    }\n    const hiddenInput = new Float64Array(H);\n    const hidden = new Float64Array(H);\n    for (let h = 0; h \u003c H; h++) {\n      let value = b1[h];\n      for (let i = 0; i \u003c input.length; i++) value += input[i] * W1[i * H + h];\n      hiddenInput[h] = value;\n      hidden[h] = Math.tanh(value);\n    }\n    const logits = new Float64Array(V);\n    for (let v = 0; v \u003c V; v++) {\n      let value = b2[v];\n      for (let h = 0; h \u003c H; h++) value += hidden[h] * W2[h * V + v];\n      logits[v] = value;\n    }\n    return { input, hiddenInput, hidden, logits, probabilities: softmax(logits) };"}]},{"title":"math.ts·nlm.ts — 크로스 엔트로피와 PPL","nodes":[["정답 토큰","예: 싫어해"],["정답 확률","예: 0.4"],["한 문제 loss","-ln(0.4) ≈ 0.9163"],["24쌍 평가","평균 loss와 exp(loss)"]],"paragraphs":["정답 토큰 하나가 정해진 다중분류 문제의 크로스 엔트로피는 -ln(정답 확률)입니다. 정답에 높은 확률을 줄수록 0에 가까워집니다. loss 자체는 퍼센트가 아닙니다.","코드의 crossEntropy는 출력 점수를 받아 logsumexp(z)-z[target]을 계산합니다. softmax를 구한 뒤 -ln(p[target])을 계산하는 것과 같은 식이지만, 작은 확률의 반올림·언더플로에 더 안정적입니다.","모델의 loss는 24쌍 손실의 평균입니다. PPL은 그 평균에 exp를 적용한 값입니다. 실험 표에서는 seed별 PPL을 계산한 후 평균내므로, 재생에 표시되는 seed123 하나의 값과 구분합니다."],"bullets":["정답 확률 99% → loss 약 0.01 / 1% → 약 4.61. 틀렸다고 loss가 100%가 되는 계산은 아닙니다.","표시가 0.00%라고 실제 수학적 확률이 정확히 0이라고 단정할 수는 없습니다.","학습 데이터 PPL은 학습 적합도입니다. 새 문장 생성 개수나 별도 평가 데이터 성능과 같은 지표가 아닙니다."],"formula":"한 문제 loss = -ln(p[정답])\n배치 loss = (모든 문제의 loss 합) / 24\nPPL = exp(배치 loss)","snippets":[{"file":"src/math.ts","anchor":"export function crossEntropy","lines":11,"label":"안정적인 크로스 엔트로피 계산","start":47,"end":57,"code":"export function crossEntropy(logits: ArrayLike\u003cnumber>, target: number): number {\n  tokenId(target, logits.length);\n  let maximum = -Infinity;\n  for (let i = 0; i \u003c logits.length; i++) {\n    if (!Number.isFinite(logits[i])) throw new Error('logit은 유한한 값이어야 합니다.');\n    maximum = Math.max(maximum, logits[i]);\n  }\n  let sum = 0;\n  for (let i = 0; i \u003c logits.length; i++) sum += Math.exp(logits[i] - maximum);\n  return maximum - logits[target] + Math.log(sum);\n}"},{"file":"nplm/nlm.ts","anchor":"loss(pairs: readonly Pair[])","lines":6,"label":"24개 문제의 평균 손실","start":73,"end":78,"code":"  loss(pairs: readonly Pair[]): number {\n    if (pairs.length === 0) throw new Error('학습 쌍이 필요합니다.');\n    let sum = 0;\n    for (const pair of pairs) sum += crossEntropy(this.forward(pair.context).logits, pair.target);\n    return sum / pairs.length;\n  }"}]},{"title":"nlm.ts — 역전파를 직접 계산하기","nodes":[["출력 기울기","p - 정답 벡터"],["W2·b2","출력층 변화량"],["은닉 기울기","tanh 미분"],["W1·b1","입력 쪽 변화량"],["E에 누적","임베딩도 학습"]],"paragraphs":["역전파는 각 학습 변수가 조금 바뀔 때 loss가 얼마나 변하는지 계산합니다. 이 민감도를 기울기라고 합니다. 자동 미분 라이브러리를 사용하지 않고 미분식을 반복문으로 작성했습니다.","softmax와 크로스 엔트로피를 합친 출력 점수의 기울기는 p-y입니다. y는 정답 위치만 1인 벡터입니다. 코드에서는 정답 위치에만 1을 빼고, 평균 손실에 맞춰 문제 수 B로 나눕니다.","그 기울기를 W2, tanh, W1 순서로 거슬러 보내고 마지막에는 E의 해당 단어 행에 더합니다. 같은 단어가 여러 위치에 나와도 기울기를 덮어쓰지 않고 누적합니다."],"formula":"dz = (p - y) / B\ndh = (dz W2ᵀ) ⊙ (1 - h²)\ndE[해당 단어] += 입력 쪽으로 전달된 기울기","snippets":[{"file":"nplm/nlm.ts","anchor":"const dz = probabilities.slice();","lines":19,"label":"출력에서 은닉층으로 기울기 전달","start":92,"end":110,"code":"      const dz = probabilities.slice();\n      dz[target] -= 1;\n      for (let v = 0; v \u003c V; v++) {\n        dz[v] /= pairs.length;\n        gradients.b2[v] += dz[v];\n      }\n\n      const dh = new Float64Array(H);\n      for (let h = 0; h \u003c H; h++) {\n        let value = 0;\n        for (let v = 0; v \u003c V; v++) {\n          gradients.W2[h * V + v] += hidden[h] * dz[v];\n          value += W2[h * V + v] * dz[v];\n        }\n        dh[h] = value * (1 - hidden[h] * hidden[h]);\n        gradients.b1[h] += dh[h];\n      }\n\n      const dx = new Float64Array(2 * D);"},{"file":"nplm/nlm.ts","anchor":"// 같은 단어의 여러 위치","lines":7,"label":"공유 임베딩 표에 기울기 누적","start":118,"end":124,"code":"      // 같은 단어의 여러 위치·여러 쌍에서 온 gradient를 같은 E 행에 누적한다.\n      for (let position = 0; position \u003c 2; position++) {\n        for (let d = 0; d \u003c D; d++) {\n          gradients.E[context[position] * D + d] += dx[position * D + d];\n        }\n      }\n    }"}]},{"title":"nlm.ts — 경사하강법으로 값을 갱신하기","nodes":[["24쌍 전체","평균 loss·기울기"],["역전파 완료","이전 가중치로 계산"],["경사하강법","값 - 학습률×기울기"],["다음 갱신","2,000회 반복"]],"paragraphs":["step은 역전파가 계산한 기울기를 사용해 실제 숫자를 바꿉니다. 기울기가 양수이면 값을 줄이고, 음수이면 값을 늘립니다. 작게 만들려는 대상은 모든 가중치가 아니라 loss입니다.","현재는 24쌍 전체로 한 번의 평균 기울기를 구하는 full-batch 경사하강법입니다. 한 문제마다 가중치를 바꾸는 SGD나 Adam을 구현한 것은 아닙니다.","모든 기울기를 구한 뒤 E·W1·b1·W2·b2를 갱신합니다. 역전파 중간에 가중치를 먼저 바꾸지 않습니다. 학습률이 너무 크면 loss가 오히려 커질 수 있으므로 실험에서는 여러 값을 비교했습니다."],"formula":"새 값 = 기존 값 - learningRate × gradient","snippets":[{"file":"nplm/nlm.ts","anchor":"step(gradients: Parameters","lines":9,"label":"다섯 변수 그룹을 갱신하는 실제 코드","start":128,"end":136,"code":"  step(gradients: Parameters, learningRate: number): void {\n    if (!Number.isFinite(learningRate) || learningRate \u003c= 0) throw new Error('학습률은 양수여야 합니다.');\n    for (const name of PARAMETER_NAMES) {\n      if (gradients[name].length !== this.parameters[name].length) throw new Error('gradient 크기가 다릅니다.');\n      for (let i = 0; i \u003c gradients[name].length; i++) {\n        this.parameters[name][i] -= learningRate * gradients[name][i];\n      }\n    }\n  }"},{"file":"nplm/nlm.ts","anchor":"for (let epoch = 0;","lines":8,"label":"손실·역전파·갱신의 반복","start":143,"end":150,"code":"  for (let epoch = 0; epoch \u003c epochs; epoch++) {\n    const { loss, gradients } = model.lossAndGradients(pairs);\n    if (!Number.isFinite(loss)) throw new Error(`${epoch + 1}번째 학습에서 loss가 유한하지 않습니다.`);\n    // 업데이트 직전의 loss는 앞선 업데이트 횟수에 대응한다.\n    losses.push(loss);\n    model.step(gradients, learningRate);\n  }\n  const finalLoss = model.loss(pairs);"}]},{"title":"generation.ts — 생성과 분류를 분리하기","nodes":[["시작 문맥","pad + bos"],["확률 계산","모델의 forward"],["추첨","다음 토큰 선택"],["종료","eos 또는 길이 제한"],["분류","원문·새 조합·오류"]],"paragraphs":["생성기는 모델에 두 토큰을 주고 확률을 받습니다. sample로 다음 토큰을 추첨하고 문맥을 한 칸 옮겨 반복합니다. 원문 문장을 검색해서 다음 토큰을 고르는 과정은 없습니다.","생성이 끝난 뒤 원문 6개와 비교합니다. 원문과 같으면 training, 주체+과일+동사의 3토큰이며 원문에 없으면 novel, 나머지는 invalid입니다. \u003ceos>로 끝나야 원문·새 조합으로 인정합니다.","출력 후보를 주체·과일·동사로 강제 제한하지 않습니다. 따라서 특수 토큰이 본문에 나오거나 순서·길이가 틀린 결과도 그대로 집계합니다."],"bullets":["새 조합 17개는 17종을 뜻하지 않습니다. 대표 설정에서는 6종이 중복을 포함해 총 17회 나왔습니다.","원문과 다른 107개 중 새 조합은 17개, 오류·미완성은 90개입니다. 1.07%와 0.17%의 분류 기준이 다릅니다.","최대 본문 길이는 20토큰이며, 그 뒤에 오는 eos도 한 번 확인합니다."],"snippets":[{"file":"generation/generation.ts","anchor":"const next = sample(probabilities, random);","lines":10,"label":"모델 확률로 다음 토큰을 생성","start":52,"end":61,"code":"    const next = sample(probabilities, random);\n    if (next === dataset.ids.get(EOS)) {\n      termination = 'eos';\n      break;\n    }\n    if (position === maxTokens) break;\n    tokens.push(dataset.tokens[next]);\n    context = [context[1], next];\n  }\n  return { tokens, sentence: tokens.join(' '), termination, category: classify(tokens, termination, dataset) };"},{"file":"generation/generation.ts","anchor":"export function classify","lines":10,"label":"생성이 끝난 뒤에만 원문과 비교","start":26,"end":35,"code":"export function classify(tokens: readonly string[], termination: Termination, dataset: Dataset): Category {\n  if (termination !== 'eos') return 'invalid';\n  if (dataset.sentences.includes(tokens.join(' '))) return 'training';\n  // 이 규칙은 생성 후의 분류에만 사용한다. 생성 확률을 제한하지 않는다.\n  if (tokens.length === 3 && SUBJECTS.some((word) => word === tokens[0])\n    && OBJECTS.some((word) => word === tokens[1]) && VERBS.some((word) => word === tokens[2])) {\n    return 'novel';\n  }\n  return 'invalid';\n}"}]},{"title":"experiment.ts — 같은 조건으로 모델 비교","nodes":[["설정 조합","D × 학습률 × seed"],["신규 모델","초기 가중치 고정"],["학습","2,000회 갱신"],["평가·생성","24쌍·10,000개"],["저장","JSON·CSV"]],"paragraphs":["임베딩 차원 1·2·3, 학습률 0.05·0.1·0.3·1.0, 초기화 seed 123·456·789로 신경망을 36회 학습합니다. 같은 D와 seed에서는 학습률이 달라도 같은 초기 가중치로 시작합니다.","각 설정의 loss·PPL은 세 학습 seed를 기록합니다. 문장 생성에는 첫 번째 학습 seed의 모델 하나를 사용하고, 추첨 seed는 2026으로 따로 고정합니다.","신경망 12설정과 트라이그램 2종에서 각각 10,000개를 생성하므로 총 140,000개입니다. D가 바뀌면 매개변수 수도 바뀌므로 모든 조건이 완전히 같다고 해석하지 않습니다."],"bullets":["comparison.json: 모든 설정·좌표·확률·생성 집계. loss.csv: 갱신별 loss·PPL.","learning_rates.csv: 설정별 표. samples/*.jsonl: 생성 결과 한 개당 한 줄.","distributions/*.csv: 문장별 횟수. 각 설정의 생성 개수와 분류 합계를 함께 기록합니다."],"snippets":[{"file":"src/experiment.ts","anchor":"for (const dimension of settings.dimensions)","lines":8,"label":"조건별 독립 모델을 학습하는 반복문","start":106,"end":113,"code":"  for (const dimension of settings.dimensions) {\n    for (const learningRate of settings.learningRates) {\n      const runs: Run[] = [];\n      let primary: NeuralLanguageModel | undefined;\n      for (const seed of settings.seeds) {\n        const model = new NeuralLanguageModel(dataset.tokens.length, dimension, settings.hidden, seed);\n        const embeddingBefore = dataset.tokens.map((_, id) => Array.from(model.parameters.E.slice(id * dimension, (id + 1) * dimension)));\n        const losses = train(model, dataset.pairs, settings.epochs, learningRate);"},{"file":"src/experiment.ts","anchor":"const finalLoss = losses.at(-1)!;","lines":8,"label":"학습 지표와 임베딩 좌표 기록","start":114,"end":121,"code":"        const finalLoss = losses.at(-1)!;\n        runs.push({\n          seed, initialLoss: losses[0], finalLoss, perplexity: Math.exp(finalLoss), embeddingBefore,\n          embeddingAfter: dataset.tokens.map((_, id) => Array.from(model.parameters.E.slice(id * dimension, (id + 1) * dimension))),\n        });\n        losses.forEach((loss, update) => lossRows.push([dimension, settings.hidden, learningRate, seed, update, loss, Math.exp(loss)]));\n        if (!primary) primary = model;\n      }"}]},{"title":"cli.ts·report.ts — 명령과 결과 문서","nodes":[["명령 인자","data·trigram·trace·compare"],["검사","옵션·숫자 검증"],["실행","데이터·모델·실험"],["문서화","Markdown·HTML 표"]],"paragraphs":["cli.ts는 명령줄의 입구입니다. 라이브러리 없이 process.argv를 읽고 허용한 옵션인지 검사합니다. data는 데이터 구조, trigram은 횟수와 확률, trace는 초기 모델 한 문제의 계산, compare는 전체 비교 실험을 실행합니다.","report.ts는 이미 계산된 비교 결과를 표·텍스트·HTML로 바꿉니다. 여기서 새로 학습하지 않습니다. 1·2·3차원 임베딩의 좌표와 ASCII 위치도 문자열로 그립니다.","trace는 학습이 끝난 저장 모델의 조회가 아니라, 초기 모델의 한 문제 순전파·역전파·한 번 갱신을 보여주는 명령이라는 점을 구분합니다."],"snippets":[{"file":"src/cli.ts","anchor":"if (command === 'trace')","lines":8,"label":"한 문제의 계산을 살펴보는 명령","start":70,"end":77,"code":"  if (command === 'trace') {\n    const context = encodeContext(dataset, (flags.get('context') ?? '철수는,사과를').split(',').map((word) => word.trim()));\n    const target = dataset.ids.get(flags.get('target') ?? '좋아해');\n    if (target === undefined) throw new Error('정답 토큰이 어휘에 없습니다.');\n    const model = new NeuralLanguageModel(dataset.tokens.length, numeric('dim', 2), numeric('hidden', DEFAULT_SETTINGS.hidden), numeric('seed', 123));\n    const forward = model.forward(context);\n    const { loss, gradients } = model.lossAndGradients([{ context, target }]);\n    const vector = (values: ArrayLike\u003cnumber>) => Array.from(values, (value) => Number(value.toFixed(6)));"},{"file":"src/report.ts","anchor":"function markdownTable","lines":5,"label":"표도 직접 문자열로 생성","start":22,"end":26,"code":"function markdownTable(headers: readonly string[], rows: readonly (readonly (string | number)[])[]): string {\n  return `| ${headers.join(' | ')} |\\n| ${headers.map(() => '---').join(' | ')} |\\n` +\n    rows.map((row) => `| ${row.join(' | ')} |`).join('\\n');\n}\n"}]},{"title":"animation.ts — 학습 중간 가중치 기록","nodes":[["같은 초기화","D2·H8·lr0.3·seed123"],["원래 역전파","같은 갱신 순서"],["20회마다 복사","가중치 101개 시점"],["매 갱신 loss","2,001개 값"]],"paragraphs":["애니메이션을 위해 새로운 학습 알고리즘을 만든 것이 아닙니다. 원래 NeuralLanguageModel의 lossAndGradients와 step을 같은 순서로 호출하면서 중간 숫자를 복사합니다.","0회 갱신의 초기 상태부터 2,000회까지 20회 간격으로 101개 가중치 스냅샷을 저장합니다. loss는 0~2,000회에 대해 모두 기록하므로 2,001개입니다.","가중치 배열을 복사해 저장해야 이후 학습이 이전 기록까지 바꾸지 않습니다. animate.ts는 끝점 가중치를 복원하고, 기존 비교 결과가 있으면 loss·임베딩·생성 집계를 대조합니다."],"snippets":[{"file":"src/animation.ts","anchor":"for (let update = 0;","lines":15,"label":"원래 계산을 재사용하면서 중간 상태 복사","start":37,"end":50,"code":"  for (let update = 0; update \u003c= settings.updates; update++) {\n    const step = update \u003c settings.updates ? model.lossAndGradients(dataset.pairs) : undefined;\n    const loss = step?.loss ?? model.loss(dataset.pairs);\n    if (!Number.isFinite(loss)) throw new Error(`${update}회 갱신에서 loss가 유한하지 않습니다.`);\n    losses.push(loss);\n    if (update % settings.recordEvery === 0 || update === settings.updates) {\n      frames.push({ update, loss,\n        parameters: Object.fromEntries(PARAMETER_NAMES.map(name => [name, Array.from(model.parameters[name])])) as Record\u003cParameterName, number[]> });\n    }\n    if (step) model.step(step.gradients, settings.learningRate);\n  }\n  return { settings: { ...settings }, data: { tokens: dataset.tokens, sentences: dataset.sentences, pairs: dataset.pairs.length }, losses, frames };\n}\n"}]},{"title":"animate.ts — 기록 복원·검산·재생 파일","nodes":[["학습 기록","가중치·loss"],["모델 복원","배열에 다시 넣기"],["확률 검산","3문맥·18문장"],["10,000회 생성","기존 집계 대조"],["HTML·JSON","외부 연결 없이 재생"]],"paragraphs":["animate.ts는 기록을 만들고 최종 가중치를 복원해 10,000개를 다시 생성합니다. 기존 comparison.json이 같은 설정이면 최종 loss·임베딩·생성 집계를 대조합니다.","중간 시점마다 세 입력 문맥의 확률도 계산해 브라우저의 순전파와 대조할 기준으로 저장합니다. 또한 주체×과일×동사의 18문장에 대해 시작부터 eos까지 확률을 곱해 원문·새 조합·기타 출력 확률을 합산합니다.","재생 HTML은 프로젝트의 SVG·차트·재생 코드를 포함합니다. 대화용 파일은 Node 기본 gzip과 브라우저 기본 압축 해제 기능으로 크기만 줄입니다. 값의 정밀도를 줄이거나 외부 서버를 호출하지 않습니다."],"bullets":["화면의 새 조합 확률 약 0.15%는 확률 합산값입니다. 실제 10,000회 추첨에서는 17회, 0.17%였습니다.","선택 문맥 다음 좋아해 확률과 전체 문장 생성 확률은 다릅니다. 전체 생성은 그 문맥까지 먼저 도달해야 합니다.","TypeScript 모델의 끝점과 loss 기록은 기존 실험과 일치합니다."],"snippets":[{"file":"src/animate.ts","anchor":"let probability = 1;","lines":10,"label":"전체 문장 확률은 각 단계의 확률을 곱해 계산","start":47,"end":56,"code":"    let probability = 1;\n    for (const word of [...words, EOS]) {\n      const next = dataset.ids.get(word)!;\n      probability *= model.forward(context).probabilities[next];\n      context = [context[1], next];\n    }\n    if (dataset.sentences.includes(words.join(' '))) training += probability;\n    else novel += probability;\n  }\n  const invalid = 1 - training - novel;"}]},{"title":"svg.js — 그래프의 바닥 계산도 직접 구현","nodes":[["모델 숫자","예: 임베딩 x=-1.2"],["범위 계산","최솟값·최댓값"],["픽셀 변환","일차식으로 좌표 변환"],["SVG 생성","점·선·눈금·글자"]],"paragraphs":["제거한 D3 대신 document.createElementNS로 SVG 요소를 직접 만듭니다. add는 요소 생성, set은 속성 지정, linear는 데이터 숫자와 화면 좌표 사이의 변환을 담당합니다.","niceDomain은 데이터 전체를 포함하는 축 범위와 읽기 쉬운 눈금을 고릅니다. bottomAxis·leftAxis는 선과 글자를 직접 배치합니다. path는 좌표들을 M·L 명령으로 연결합니다.","이 파일은 학습이나 확률을 계산하지 않습니다. 같은 모델 숫자를 화면의 어느 위치에 그릴지 결정하는 작은 내부 도구입니다. 외부 차트 엔진을 감싼 래퍼가 아닙니다."],"formula":"픽셀 = r0 + (데이터값-d0)/(d1-d0) × (r1-r0)","snippets":[{"file":"src/svg.js","anchor":"function add(parent","lines":8,"label":"브라우저 기본 API로 SVG 요소 생성","start":13,"end":20,"code":"  function add(parent, name, attributes = {}, text) {\n    const node = document.createElementNS(namespace, name);\n    set(node, attributes);\n    if (text !== undefined) node.textContent = String(text);\n    parent.append(node);\n    return node;\n  }\n  function range(count) {"},{"file":"src/svg.js","anchor":"function linear(domain","lines":8,"label":"직접 작성한 좌표 변환과 역변환","start":34,"end":41,"code":"  function linear(domain, output) {\n    const [d0, d1] = domain, [r0, r1] = output;\n    if (![d0,d1,r0,r1].every(Number.isFinite)) throw new Error('좌표 변환 범위는 유한해야 합니다.');\n    const scale = value => d0 === d1 ? (r0+r1)/2 : r0+(value-d0)/(d1-d0)*(r1-r0);\n    scale.invert = value => r0 === r1 ? (d0+d1)/2 : d0+(value-r0)/(r1-r0)*(d1-d0);\n    return scale;\n  }\n  function niceDomain(minimum, maximum, count = 5) {"}]},{"title":"training-charts.js — 신경망·확률·곡선·산점도","nodes":[["가중치 기록","E·W1·W2와 값들"],["화면 구조","점·선·막대 생성"],["현재 시점","속성·좌표 갱신"],["차트 표시","축·이름 겹침 보정"]],"paragraphs":["drawNetwork는 4×8과 8×11 연결선을 이중 반복문으로 만듭니다. 각 시점의 실제 가중치 절댓값으로 선 진하기를, 실제 tanh 결과로 은닉 뉴런의 값을 갱신합니다.","drawProbabilities는 11개 토큰의 확률 막대를 그립니다. drawLoss는 loss와 PPL의 실제 기록을 선으로 연결하고 현재 시점까지 보여줍니다. drawEmbedding은 E의 두 성분을 x·y 좌표로 바꿔 단어 위치와 이동 경로를 그립니다.","축 범위는 재생 전체의 데이터를 보고 고정해, 학습 중 축 자체가 바뀌어 움직임을 왜곡하지 않도록 했습니다. 이름이 겹치면 주변 후보 위치를 검사하고 연결선을 사용합니다."],"snippets":[{"file":"src/training-charts.js","anchor":"const inputEdges=","lines":5,"label":"완전연결 선을 직접 생성하는 반복문","start":37,"end":41,"code":"    const inputEdges=range(4).flatMap(i=>range(H).map(h=>({i,h,node:add(svg,'line',{class:'weight',x1:eX,y1:eY[i],x2:hX,y2:hY(h),stroke:'var(--muted-foreground)','stroke-width':.8})})));\n    const outputEdges=range(H).flatMap(h=>range(V).map(v=>({h,v,node:add(svg,'line',{class:'weight',x1:hX,y1:hY(h),x2:oX,y2:oY(v),'stroke-width':.8})})));\n    const contextLabels=[106,266].map(y=>add(svg,'text',{x:eX,y,'text-anchor':'middle'}));\n    const inputs=range(4).map(i=>{add(svg,'circle',{cx:eX,cy:eY[i],r:8,fill:'var(--chart-1)'});return add(svg,'text',{x:eX-13,y:eY[i]+4,'text-anchor':'end'});});\n    const hidden=range(H).map(h=>add(svg,'circle',{cx:hX,cy:hY(h),r:15,fill:'var(--chart-4)',stroke:'var(--border)'}));"},{"file":"src/training-charts.js","anchor":"function drawLoss(ppl=false)","lines":14,"label":"loss·PPL 값을 화면 좌표로 변환","start":74,"end":87,"code":"  function drawLoss(ppl=false){\n    const{svg,width}=canvas(ppl?'[data-ppl-chart]':'[data-loss-chart]',320);\n    const values=ppl?data.losses.map(value=>Math.exp(value)):data.losses;\n    const left=64,right=width-20,top=22,bottom=266;\n    const [minimum,maximum]=extent(values),padding=(maximum-minimum)*.08;\n    const domain=niceDomain(Math.max(0,minimum-padding),maximum+padding,5);\n    const x=linear([0,data.settings.updates],[left+5,right-5]),y=linear(domain.domain,[bottom-5,top+5]);\n    frame(svg,left,top,right-left,bottom-top);\n    const ticks=width\u003c500?[0,data.settings.updates/2,data.settings.updates]:range(5).map(i=>i*data.settings.updates/4);\n    bottomAxis(svg,x,ticks,bottom,value=>String(Math.round(value)));leftAxis(svg,y,domain.ticks,left);\n    label(svg,'x','가중치 갱신 (회)',(left+right)/2,313);\n    label(svg,'y',ppl?'PPL':'평균 loss',15,(top+bottom)/2,`rotate(-90,15,${(top+bottom)/2})`);\n    const clipId=ppl?'chapter4-ppl-reveal':'chapter4-loss-reveal';\n    const clip=add(add(add(svg,'defs'),'clipPath',{id:clipId,clipPathUnits:'userSpaceOnUse'}),'rect',{class:'moving',x:0,y:0,width:right-left,height:bottom-top});"}]},{"title":"training-animation.js·HTML — 재생 조작","nodes":[["재생·슬라이더","시점 인덱스 변경"],["가중치 선택","저장된 한 시점"],["순전파 재계산","선택 문맥의 확률"],["그래프 갱신","숫자·좌표·막대"]],"paragraphs":["HTML 템플릿은 버튼·선택 상자·슬라이더와 SVG가 들어갈 자리를 정의합니다. training-animation.js는 그 요소들에 이벤트를 연결하고 현재 시점·문맥·그래프 종류를 관리합니다.","requestAnimationFrame으로 재생 상태를 확인하며 200ms마다 다음 저장 기록을 보여줍니다. 끝에 도달하면 멈추고 자동 반복하지 않습니다. 슬라이더를 움직이면 일시정지한 뒤 선택한 기록으로 이동합니다.","브라우저는 학습을 새로 하지 않고 저장된 가중치의 순전파를 계산합니다. 이 확률을 TypeScript 모델이 저장한 기준값과 모든 기록 시점에서 비교합니다. 동작 줄이기 설정에서는 수동으로 한 기록씩 넘깁니다."],"bullets":["재생 20초는 학습 실행 시간 측정값이 아닙니다. 학습 결과를 설명하기 위한 재생 속도입니다.","입력 문맥 선택은 관찰 대상을 바꿉니다. 학습 데이터나 가중치를 수정하지 않습니다.","화면의 값은 표시를 위해 반올림하지만, 저장된 가중치와 모델 계산은 원래 정밀도를 유지합니다."],"snippets":[{"file":"src/training-animation.js","anchor":"function tick(time)","lines":11,"label":"재생·끝점 정지","start":89,"end":99,"code":"  function tick(time) {\n    if (!state.playing) return;\n    if (document.hidden) { pause(); return; }\n    if (time - state.lastTime >= 200) {\n      state.lastTime = time;\n      setFrame(state.index + 1);\n      if (state.index === frames.length - 1) { pause(); remember(); return; }\n    }\n    state.raf = requestAnimationFrame(tick);\n  }\n  function play() {"},{"file":"src/training-animation.template.html","anchor":"\u003cdiv class=\"controls\">","lines":13,"label":"기본 HTML 요소로 조작부 정의","start":40,"end":52,"code":"  \u003cdiv class=\"controls\">\n    \u003clabel class=\"button-hit\" for=\"training-play\">\u003cbutton class=\"btn btn-primary\" type=\"button\" id=\"training-play\" data-play>재생\u003c/button>\u003c/label>\n    \u003clabel class=\"button-hit\" for=\"training-reset\">\u003cbutton class=\"btn\" type=\"button\" id=\"training-reset\" data-reset>처음으로\u003c/button>\u003c/label>\n    \u003clabel class=\"field form-label\">그래프\n      \u003cselect class=\"form-select\" data-view-select>\n        \u003coption value=\"network\">신경망·다음 토큰 확률\u003c/option>\n        \u003coption value=\"embedding\">임베딩 이동\u003c/option>\n        \u003coption value=\"loss\">loss·PPL 곡선\u003c/option>\n      \u003c/select>\n    \u003c/label>\n  \u003c/div>\n  \u003clabel class=\"timeline form-label\">가중치 갱신 \u003cspan data-update>0 / 2,000회\u003c/span>\n    \u003cinput class=\"form-range\" type=\"range\" min=\"0\" max=\"100\" step=\"1\" value=\"0\" data-time aria-label=\"학습 기록 시점\">"}]},{"title":"gradcheck.ts — 직접 미분한 기울기 검산","nodes":[["직접 역전파","각 변수의 기울기"],["양쪽으로 이동","가중치 ± epsilon"],["수치 미분","양쪽 loss의 차이"],["오차 대조","모든 성분 확인"]],"paragraphs":["일반 테스트 파일 대신 scripts/gradcheck.ts 하나를 남겼습니다. 모델 실행에 테스트 파일이 필수인 것은 아니지만, 자동 미분 없이 작성한 역전파를 독립적인 계산으로 검산하는 것은 이 실습의 핵심입니다.","원래 여섯 문장에서 만든 24쌍을 사용합니다. 임베딩 D=1·2·3, 은닉 H=8에서 E·W1·b1·W2·b2의 전체 483개 성분을 중심 차분과 대조합니다. 같은 단어가 여러 입력에 반복되는 경우도 포함됩니다.","npm run gradcheck로 실행합니다. 일반 테스트 러너는 사용하지 않습니다. TypeScript의 타입 검사는 npm run typecheck로 따로 수행합니다."],"formula":"수치 기울기 = (L(w + epsilon) - L(w - epsilon)) / (2 × epsilon)","snippets":[{"file":"scripts/gradcheck.ts","anchor":"const original = model.parameters[name][i];","lines":12,"label":"양쪽 loss로 수치 미분을 구해 직접 미분과 대조","start":17,"end":28,"code":"      const original = model.parameters[name][i];\n      let plus = 0, minus = 0;\n      try {\n        model.parameters[name][i] = original + epsilon;\n        plus = model.loss(dataset.pairs);\n        model.parameters[name][i] = original - epsilon;\n        minus = model.loss(dataset.pairs);\n      } finally {\n        model.parameters[name][i] = original;\n      }\n      const numerical = (plus - minus) / (2 * epsilon);\n      maximumError = Math.max(maximumError, Math.abs(numerical - gradients[name][i]));"}]},{"title":"이 해설 문서의 생성과 코드 읽는 순서","nodes":[["해설 정의","docs의 JSON"],["실제 파일 읽기","코드 구간 추출"],["그림·문서","직접 SVG·HTML 생성"],["검토","실제 코드와 나란히"]],"paragraphs":["이 해설의 코드 블록은 별도의 예제 코드를 다시 작성한 것이 아니라, 현재 파일에서 실제 줄을 읽어 발췌한 것입니다. 각 블록에 파일명과 줄 범위를 표시합니다.","scripts/build-guide.ts가 설명 정의와 실제 소스를 합쳐 IMPLEMENTATION.md와 이 HTML을 만듭니다. 문서의 도형도 svg.js로 직접 그립니다. 문서 생성에도 마크다운·다이어그램 라이브러리를 사용하지 않습니다.","처음에는 data.ts → trigram.ts → math.ts → nlm.ts → generation.ts 순서로 읽고, 그다음 실험·리포트·재생 코드를 읽는 것이 좋습니다. 모델 계산과 화면 표시를 구분하면서 한 입력 문맥을 따라가면 흐름을 확인할 수 있습니다."],"snippets":[{"file":"scripts/build-guide.ts","anchor":"const prepared =","lines":10,"label":"현재 소스에서 직접 발췌해 문서 생성","start":18,"end":27,"code":"const prepared = definitions.map(section => ({\n  ...section,\n  snippets: section.snippets.map(snippet => {\n    const source = readFileSync(join(root, snippet.file), 'utf8').split('\\n');\n    const start = source.findIndex(line => line.includes(snippet.anchor));\n    assert.ok(start >= 0, `${snippet.file}: 코드 구간을 찾을 수 없습니다: ${snippet.anchor}`);\n    const end = Math.min(start + snippet.lines, source.length);\n    return { ...snippet, start: start + 1, end, code: source.slice(start, end).join('\\n') };\n  }),\n}));"}]}],"runtimeDependencies":[],"devDependencies":{"@types/node":"24.19.2","typescript":"7.0.2"}};</script>
<script>(() => {
  const root=document.getElementById('implementation-guide');
  const data=chapter4GuideData;
  const {add,set}=globalThis.NplmSvg;
  const select=root.querySelector('[data-section]');
  const codeSelect=root.querySelector('[data-code-section]');
  const previous=root.querySelector('[data-previous]'),next=root.querySelector('[data-next]');
  let index=0,codeIndex=0,lastWidth=0;
  function textElement(tag,text,parent){const node=document.createElement(tag);node.textContent=text;parent.append(node);return node;}
  data.sections.forEach((section,i)=>{const option=document.createElement('option');option.value=String(i);option.textContent=`${i+1}. ${section.title}`;select.append(option);});
  function draw(){
    const section=data.sections[index],svg=root.querySelector('svg'),width=svg.getBoundingClientRect().width,wide=width>=650;
    svg.replaceChildren();
    const defs=add(svg,'defs'),marker=add(defs,'marker',{id:'implementation-arrow',viewBox:'0 0 10 10',refX:8,refY:5,markerWidth:6,markerHeight:6,orient:'auto-start-reverse'});
    add(marker,'path',{d:'M0,0 L10,5 L0,10 Z',fill:'var(--muted-foreground)'});
    let boxes,height,connections;
    if(section.kind==='branches'){
      if(wide){const w=140;boxes=[{x:0,y:90,w},{x:width*.27,y:22,w},{x:width*.27,y:158,w},{x:width*.56,y:90,w},{x:width-w,y:90,w}];height=250;}
      else{const w=(width-20)/2,center=(width-w)/2;boxes=[{x:center,y:8,w},{x:0,y:105,w},{x:width-w,y:105,w},{x:center,y:202,w},{x:center,y:299,w}];height=390;}
      connections=[[0,1],[0,2],[1,3],[2,3],[3,4]];
    }else{
      const n=section.nodes.length,gap=18,w=wide?(width-(n-1)*gap)/n:width-32;
      boxes=section.nodes.map((_,i)=>({x:wide?i*(w+gap):16,y:wide?18:i*88+5,w}));
      height=wide?112:n*88+4;connections=section.nodes.slice(1).map((_,i)=>[i,i+1]);
    }
    set(svg,{viewBox:`0 0 ${width} ${height}`,height});
    for(const[a,b]of connections){const from=boxes[a],to=boxes[b];const d=wide?`M${from.x+from.w+2},${from.y+32} L${to.x-5},${to.y+32}`:`M${from.x+from.w/2},${from.y+66} L${to.x+to.w/2},${to.y-5}`;add(svg,'path',{d,fill:'none',stroke:'var(--muted-foreground)','stroke-width':1.3,'marker-end':'url(#implementation-arrow)'});}
    section.nodes.forEach((node,i)=>{
      const b=boxes[i],center=b.x+b.w/2;
      add(svg,'rect',{x:b.x+.5,y:b.y+.5,width:b.w-1,height:65,rx:7,fill:'var(--muted)',stroke:'var(--border)'});
      add(svg,'text',{x:center,y:b.y+23,'text-anchor':'middle','font-weight':500},node[0]);
      const detail=add(svg,'text',{x:center,y:b.y+43,'text-anchor':'middle','font-size':12});
      const lines=[];let line='';
      for(const character of node[1]){detail.textContent=line+character;if(detail.getComputedTextLength()>b.w-24&&line){lines.push(line);line=character;}else line+=character;}
      if(line)lines.push(line);detail.textContent='';
      lines.forEach((value,j)=>add(detail,'tspan',{x:center,y:b.y+43+j*14},value));
    });
  }
  function showCode(value){
    const section=data.sections[index];codeIndex=Math.max(0,Math.min(section.snippets.length-1,Number(value)||0));codeSelect.value=String(codeIndex);
    const snippet=section.snippets[codeIndex],snippets=root.querySelector('[data-snippets]');snippets.replaceChildren();
    textElement('div',snippet.label,snippets).className='snippet-label';textElement('div',`${snippet.file} · ${snippet.start}~${snippet.end}행`,snippets).className='source-range';const pre=document.createElement('pre');textElement('code',snippet.code,pre);snippets.append(pre);
  }
  function show(value,save=false){
    index=Math.max(0,Math.min(data.sections.length-1,Number(value)||0));
    const section=data.sections[index];select.value=String(index);previous.disabled=index===0;next.disabled=index===data.sections.length-1;
    root.querySelector('[data-progress]').textContent=`${index+1} / ${data.sections.length}`;
    root.querySelector('[data-title]').textContent=section.title;
    const paragraphs=root.querySelector('[data-paragraphs]');paragraphs.replaceChildren();section.paragraphs.forEach(text=>textElement('p',text,paragraphs));
    const list=root.querySelector('[data-bullets]');list.replaceChildren();(section.bullets??[]).forEach(text=>textElement('li',text,list));list.hidden=!section.bullets?.length;
    const formula=root.querySelector('[data-formula]');formula.hidden=!section.formula;formula.textContent=section.formula??'';
    codeSelect.replaceChildren();section.snippets.forEach((snippet,i)=>{const option=document.createElement('option');option.value=String(i);option.textContent=snippet.label;codeSelect.append(option);});
    root.querySelector('[data-code-picker]').hidden=section.snippets.length<=1;showCode(0);
    draw();
    if(save&&window.openai?.setWidgetState)window.openai.setWidgetState({modelContent:{chapter:index,title:section.title}}).catch(()=>{});
  }
  previous.addEventListener('click',()=>show(index-1,true));next.addEventListener('click',()=>show(index+1,true));select.addEventListener('change',()=>show(select.value,true));
  codeSelect.addEventListener('change',()=>showCode(codeSelect.value));
  const saved=window.openai?.widgetState;show(saved?.modelContent?.chapter??saved?.chapter??0);
  lastWidth=root.clientWidth;new ResizeObserver(()=>{if(root.clientWidth!==lastWidth){lastWidth=root.clientWidth;draw();}}).observe(root);
  window.addEventListener('openai:set_globals',event=>{const state=event.detail?.globals?.widgetState;const chapter=state?.modelContent?.chapter??state?.chapter;if(chapter!==undefined)show(chapter);});
  window.chapter4Guide={show,showCode,count:data.sections.length,snippetCount:()=>data.sections[index].snippets.length,check:()=>({index,codeIndex,overflow:document.documentElement.scrollWidth>document.documentElement.clientWidth})};
  console.log(JSON.stringify({sourceGuide:data.sections.length,runtimeLibraries:data.runtimeDependencies.length}));
})();
</script>
